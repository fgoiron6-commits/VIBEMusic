<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>VIBE Music</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: linear-gradient(180deg, #1b0b12 0%, #0b0b0f 28%, #09090c 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 135px;
      overflow-x: hidden;
    }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      background: rgba(14, 10, 14, 0.88);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: #FF0055; display: grid; place-items: center; font-size: 12px;
    }
    .icon-btn {
      background: rgba(255,255,255,0.08); border: none; color: #fff;
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer; font-size: 16px;
    }
    .chips-row {
      display: flex; gap: 8px; overflow-x: auto; padding: 6px 16px 14px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 8px 15px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      color: #e5e5e5; white-space: nowrap; cursor: pointer;
    }
    .chip.active { background: #FF0055; border-color: #FF0055; color: #fff; }
    .section { padding: 8px 16px 18px; }
    .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sec-title { font-size: 18px; font-weight: 800; }
    .pill-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .mix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mix-card {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.06); border-radius: 10px; padding: 6px;
      cursor: pointer; overflow: hidden;
    }
    .mix-card img { width: 48px; height: 48px; border-radius: 7px; object-fit: cover; flex-shrink: 0; background: #222; }
    .mix-meta { min-width: 0; }
    .mix-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mix-sub { font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .shortcut-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .sc-card {
      position: relative; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden;
      background: #1c1c24; cursor: pointer;
    }
    .sc-card img { width: 100%; height: 100%; object-fit: cover; }
    .sc-label {
      position: absolute; inset: auto 0 0 0; padding: 18px 8px 7px;
      background: linear-gradient(transparent, rgba(0,0,0,0.88));
      font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .v-list { display: flex; flex-direction: column; gap: 10px; }
    .v-row {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.04); padding: 8px; border-radius: 12px; cursor: pointer;
    }
    .v-row img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0; }
    .v-meta { flex: 1; min-width: 0; }
    .v-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-sub { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .loader { text-align: center; color: #aaa; padding: 36px 16px; font-size: 14px; }
    .view { display: none; }
    .view.active { display: block; }
    .search-box-wrap { padding: 12px 16px; position: sticky; top: 58px; background: #0d0c11; z-index: 30; }
    .search-input {
      width: 100%; padding: 12px 16px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08);
      color: #fff; font-size: 14px; outline: none;
    }
    .mini-player {
      position: fixed; left: 10px; right: 10px; bottom: 64px; z-index: 50;
      background: #1b1822; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 8px 12px;
      display: none; align-items: center; gap: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.65);
    }
    .mini-player img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; }
    .mini-meta { flex: 1; min-width: 0; cursor: pointer; }
    .mini-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 11px; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; height: 56px; z-index: 45;
      background: #0c0c10; border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-around; align-items: center;
    }
    .nav-item {
      background: none; border: none; color: #888; font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
    }
    .nav-item.active { color: #FF0055; }
    .full-player {
      position: fixed; inset: 0; z-index: 80;
      background: linear-gradient(180deg, #24101a 0%, #0b0b0f 100%);
      display: none; flex-direction: column; padding: 18px 20px 24px;
      overflow-y: auto;
    }
    .fp-top { display: flex; justify-content: space-between; align-items: center; }
    .fp-art {
      width: min(76vw, 310px); aspect-ratio: 1 / 1; border-radius: 18px;
      object-fit: cover; margin: 22px auto 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      background: #1e1e26;
    }
    .fp-badge {
      align-self: center; font-size: 10px; font-weight: 800; letter-spacing: 0.6px;
      background: rgba(255,0,85,0.2); color: #ff6b9d; border: 1px solid rgba(255,0,85,0.4);
      padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
    }
    .fp-info { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .fp-title { font-size: 20px; font-weight: 800; }
    .fp-artist { font-size: 14px; color: #bbb; margin-top: 3px; }
    .progress-wrap { margin: 18px 0 6px; }
    .progress-bar { width: 100%; accent-color: #FF0055; }
    .time-row { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-top: 4px; }
    .tool-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
    .tool-pill {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
      color: #eee; padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .tool-pill.active { background: rgba(255,0,85,0.25); border-color: #FF0055; color: #ff85ae; }
    .controls-row { display: flex; justify-content: space-around; align-items: center; margin: 14px 0 18px; }
    .play-big {
      width: 62px; height: 62px; border-radius: 50%; background: #FF0055; border: none;
      color: #fff; font-size: 24px; display: grid; place-items: center; cursor: pointer;
    }
    .drawer-tabs { display: flex; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; gap: 8px; }
    .d-tab {
      flex: 1; padding: 9px; border-radius: 10px; background: rgba(255,255,255,0.06);
      border: none; color: #bbb; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .d-tab.active { background: #FF0055; color: #fff; }
    .drawer-box { margin-top: 12px; max-height: 240px; overflow-y: auto; }
    .lyrics-text { white-space: pre-line; font-size: 14px; line-height: 1.65; color: #e2e2e2; text-align: center; padding: 10px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon">▶</span><span>VIBE Music</span></div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" onclick="reloadHomeFresh()" title="Acak Ulang">↻</button>
      <button class="icon-btn" onclick="switchTab('search')" title="Cari">🔍</button>
    </div>
  </header>

  <section id="viewHome" class="view active">
    <div class="chips-row" id="moodChips">
      <div class="chip active" onclick="loadMood(this, 'random')">Acak Populer</div>
      <div class="chip" onclick="loadMood(this, 'senang')">Senang</div>
      <div class="chip" onclick="loadMood(this, 'eropa')">Mix Eropa</div>
      <div class="chip" onclick="loadMood(this, 'santai')">Bersantai</div>
      <div class="chip" onclick="loadMood(this, 'indo')">Galau Indo</div>
      <div class="chip" onclick="loadMood(this, 'rnb')">Late Night R&amp;B</div>
    </div>
    <div id="homeContent"><div class="loader">Menyiapkan deretan lagu pilihanmu...</div></div>
  </section>

  <section id="viewSearch" class="view">
    <div class="search-box-wrap">
      <input id="searchInput" class="search-input" type="search" placeholder="Cari artis atau lagu (Daniel Caesar, Tulus, SZA...)" />
    </div>
    <div class="section" id="searchResults">
      <div class="loader">Ketik nama artis atau judul lagu untuk mulai mencari.</div>
    </div>
  </section>

  <section id="viewLibrary" class="view">
    <div class="section">
      <div class="sec-head"><span class="sec-title">Koleksi &amp; Riwayat</span></div>
      <div class="drawer-tabs" style="border:none;padding-top:0;margin-bottom:12px;">
        <button id="libLikedBtn" class="d-tab active" onclick="renderLibrary('liked')">Disukai (❤️)</button>
        <button id="libRecentBtn" class="d-tab" onclick="renderLibrary('recent')">Terakhir Diputar</button>
      </div>
      <div id="libraryList"></div>
    </div>
  </section>

  <div class="mini-player" id="miniPlayer">
    <img id="miniCover" src="" alt="" onclick="openFullPlayer()" />
    <div class="mini-meta" onclick="openFullPlayer()">
      <div class="mini-title" id="miniTitle">-</div>
      <div class="mini-artist" id="miniArtist">-</div>
    </div>
    <button class="icon-btn" id="miniPlayBtn" onclick="togglePlay()">▶</button>
    <button class="icon-btn" onclick="playNext()">⏭</button>
  </div>

  <nav class="bottom-nav">
    <button id="navHome" class="nav-item active" onclick="switchTab('home')"><span>🏠</span><span>Home</span></button>
    <button id="navSearch" class="nav-item" onclick="switchTab('search')"><span>🧭</span><span>Explore</span></button>
    <button id="navLibrary" class="nav-item" onclick="switchTab('library')"><span>📚</span><span>Library</span></button>
  </nav>

  <div class="full-player" id="fullPlayer">
    <div class="fp-top">
      <button class="icon-btn" onclick="closeFullPlayer()">⌄</button>
      <span style="font-size:12px;font-weight:700;color:#bbb;">SEDANG DIPUTAR</span>
      <button class="icon-btn" id="fpLikeBtn" onclick="toggleLikeCurrent()">🤍</button>
    </div>
    <img id="fpArt" class="fp-art" src="" alt="" />
    <div class="fp-badge" id="streamBadge">SIAP MEMUTAR</div>
    <div class="fp-info">
      <div style="min-width:0;">
        <div class="fp-title" id="fpTitle">-</div>
        <div class="fp-artist" id="fpArtist">-</div>
      </div>
    </div>

    <div class="progress-wrap">
      <input id="seekBar" class="progress-bar" type="range" min="0" max="100" value="0" oninput="seekAudio(this.value)" />
      <div class="time-row"><span id="curTime">0:00</span><span id="totTime">0:00</span></div>
    </div>

    <div class="tool-row">
      <button class="tool-pill" id="sleepBtn" onclick="cycleSleep()">⏱ Sleep: Off</button>
      <button class="tool-pill" id="eqBtn" onclick="cycleEq()">🎛 EQ: Normal</button>
      <button class="tool-pill active" id="autoBtn" onclick="toggleAutoplay()">♾ Autoplay: ON</button>
    </div>

    <div class="controls-row">
      <button class="icon-btn" id="shufBtn" onclick="toggleShuffle()">🔀</button>
      <button class="icon-btn" onclick="playPrev()">⏮</button>
      <button class="play-big" id="fpPlayBtn" onclick="togglePlay()">▶</button>
      <button class="icon-btn" onclick="playNext()">⏭</button>
      <button class="icon-btn" id="repBtn" onclick="cycleRepeat()">🔁</button>
    </div>

    <div class="drawer-tabs">
      <button id="tabQueue" class="d-tab active" onclick="switchDrawer('queue')">BERIKUTNYA</button>
      <button id="tabLyrics" class="d-tab" onclick="switchDrawer('lyrics')">LIRIK</button>
      <button id="tabRelated" class="d-tab" onclick="switchDrawer('related')">TERKAIT</button>
    </div>
    <div class="drawer-box" id="drawerBox"></div>
  </div>

  <audio id="bgAudio" crossorigin="anonymous" preload="auto"></audio>
  <div id="ytHiddenHolder" style="position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;bottom:0;left:0;">
    <div id="ytPlayerFrame"></div>
  </div>
  <script>
    const FALLBACK_COVER = "https://cdn-icons-png.flaticon.com/512/3844/3844724.png";
    const MOOD_MAP = {
      random: ["Sabrina Carpenter Billie Eilish 2026", "Bruno Mars Lady Gaga ROSÉ APT", "Tulus Bernadya Mahalini Juicy Luicy", "Daniel Caesar Frank Ocean SZA NIKI"],
      senang: ["Sabrina Carpenter Espresso Dua Lipa", "Bruno Mars Uptown Funk", "Tulus Hati-Hati di Jalan RAN"],
      eropa: ["Central Cee Raye Dua Lipa Fred again", "Arctic Monkeys Coldplay Glass Animals", "Top Euro Pop Hits 2026"],
      santai: ["Daniel Caesar Best Part Rex Orange County", "Wave to Earth d4vd Keshi LANY", "Nadin Amizah Feby Putri Hindia"],
      indo: ["Bernadya Satu Bulan Mahalini", "Juicy Luicy Lantas Sal Priadi", "Lyodra Tiara Andini Rizky Febian"],
      rnb: ["Frank Ocean SZA Brent Faiyaz", "Daniel Caesar Always Get You", "Giveon Kehlani PinkPantheress"]
    };

    const EMERGENCY_SEEDS = [
      { videoId: "", trackId: "s1", title: "Always", artist: "Daniel Caesar", duration: "3:45", cover: FALLBACK_COVER },
      { videoId: "", trackId: "s2", title: "Best Part", artist: "Daniel Caesar, H.E.R.", duration: "3:29", cover: FALLBACK_COVER },
      { videoId: "", trackId: "s3", title: "Espresso", artist: "Sabrina Carpenter", duration: "2:55", cover: FALLBACK_COVER },
      { videoId: "", trackId: "s4", title: "Birds of a Feather", artist: "Billie Eilish", duration: "3:30", cover: FALLBACK_COVER },
      { videoId: "", trackId: "s5", title: "Satu Bulan", artist: "Bernadya", duration: "3:20", cover: FALLBACK_COVER },
      { videoId: "", trackId: "s6", title: "Lantas", artist: "Juicy Luicy", duration: "3:54", cover: FALLBACK_COVER }
    ];

    let queue = [];
    let currentIndex = -1;
    let isPlaying = false;
    let isShuffle = true;
    let repeatMode = 0;
    let autoplayOn = true;
    let activeEngine = "native";
    let playToken = 0;
    let activeDrawer = "queue";
    let relatedCache = [];
    let searchCache = [];
    let ytPlayer = null;
    let ytReady = false;

    const bgAudio = document.getElementById("bgAudio");

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function fmtTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    async function fetchWithTimeout(url, ms = 4200) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        clearTimeout(t);
        return r;
      } catch (e) {
        clearTimeout(t);
        throw e;
      }
    }

    async function fetchCatalog(query, limit = 18) {
      try {
        const r = await fetchWithTimeout(`/api/search?q=${encodeURIComponent(query)}&limit=${limit}&_t=${Date.now()}`, 4500);
        if (r.ok) {
          const d = await r.json();
          if (d.results?.length) {
            return d.results.map(x => ({ ...x, cover: x.cover || FALLBACK_COVER }));
          }
        }
      } catch {}

      try {
        const ir = await fetchWithTimeout(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=${limit}&country=ID`, 4000);
        if (ir.ok) {
          const ij = await ir.json();
          const list = (ij.results || []).map(it => {
            const sec = Math.floor((it.trackTimeMillis || 210000) / 1000);
            return {
              videoId: "",
              trackId: `it_${it.trackId || Math.random()}`,
              title: it.trackName || "Unknown",
              artist: it.artistName || "Unknown Artist",
              duration: `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`,
              cover: (it.artworkUrl100 || "").replace("100x100bb", "500x500bb") || FALLBACK_COVER
            };
          });
          if (list.length) return list;
        }
      } catch {}

      try {
        const ar = await fetchWithTimeout(`https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(query)}&limit=${limit}`, 4000);
        if (ar.ok) {
          const aj = await ar.json();
          return (aj.data || []).filter(x => x.id).map(x => {
            const sec = Math.floor(x.duration || 180);
            return {
              videoId: "",
              trackId: String(x.id),
              title: x.title || "Unknown",
              artist: x.user?.name || "Unknown Artist",
              duration: `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`,
              cover: x.artwork?.["480x480"] || FALLBACK_COVER,
              directAudio: `https://discoveryprovider.audius.co/v1/tracks/${x.id}/stream`
            };
          });
        }
      } catch {}

      return [];
    }

    function renderHomeSections(items, labelTitle = "Mix lagu populer") {
      const box = document.getElementById("homeContent");
      const mix = items.slice(0, 8);
      const shortcuts = items.slice(8, 17);
      const rest = items.slice(17, 45);
      box.innerHTML = `
        <div class="section">
          <div class="sec-head">
            <span class="sec-title">${esc(labelTitle)}</span>
            <button class="pill-btn" onclick="playQueueIndex(0)">Putar semua</button>
          </div>
          <div class="mix-grid">
            ${mix.map((t, i) => `
              <div class="mix-card" onclick="playQueueIndex(${i})">
                <img src="${esc(t.cover)}" loading="lazy" />
                <div class="mix-meta">
                  <div class="mix-title">${esc(t.title)}</div>
                  <div class="mix-sub">${esc(t.artist)}</div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
        ${shortcuts.length ? `
        <div class="section">
          <div class="sec-head"><span class="sec-title">Pintasan cepat</span></div>
          <div class="shortcut-grid">
            ${shortcuts.map((t, i) => `
              <div class="sc-card" onclick="playQueueIndex(${i + 8})">
                <img src="${esc(t.cover)}" loading="lazy" />
                <div class="sc-label">${esc(t.title)}</div>
              </div>
            `).join("")}
          </div>
        </div>` : ""}
        ${rest.length ? `
        <div class="section">
          <div class="sec-head"><span class="sec-title">Rekomendasi Untukmu</span></div>
          <div class="v-list">
            ${rest.map((t, i) => `
              <div class="v-row" onclick="playQueueIndex(${i + 17})">
                <img src="${esc(t.cover)}" loading="lazy" />
                <div class="v-meta">
                  <div class="v-title">${esc(t.title)}</div>
                  <div class="v-sub">${esc(t.artist)} • ${esc(t.duration)}</div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>` : ""}
      `;
    }

    async function loadMood(chipEl, key) {
      if (chipEl) {
        document.querySelectorAll("#moodChips .chip").forEach(c => c.classList.remove("active"));
        chipEl.classList.add("active");
      }
      const box = document.getElementById("homeContent");
      box.innerHTML = '<div class="loader">Memuat lagu pilihan...</div>';
      const pool = shuffle(MOOD_MAP[key] || MOOD_MAP.random).slice(0, 3);
      const res = await Promise.all(pool.map(q => fetchCatalog(q, 16)));
      const merged = shuffle(res.flat());
      const seen = new Set();
      const unique = [];
      for (const t of merged) {
        const k = `${t.title.toLowerCase()}::${t.artist.toLowerCase()}`;
        if (!seen.has(k)) { seen.add(k); unique.push(t); }
      }
      queue = unique.length ? unique : [...EMERGENCY_SEEDS];
      renderHomeSections(queue, chipEl ? `Mix ${chipEl.textContent}` : "Mix lagu populer");
    }

    function reloadHomeFresh() {
      const active = document.querySelector("#moodChips .chip.active");
      loadMood(active, "random");
    }

    let searchTimer = null;
    document.getElementById("searchInput").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      const q = e.target.value.trim();
      searchTimer = setTimeout(() => executeSearch(q), 360);
    });

    async function executeSearch(q) {
      const box = document.getElementById("searchResults");
      if (!q) {
        box.innerHTML = '<div class="loader">Ketik nama artis atau judul lagu untuk mulai mencari.</div>';
        return;
      }
      box.innerHTML = `<div class="loader">Mencari "${esc(q)}"...</div>`;
      const items = await fetchCatalog(q, 24);
      searchCache = items;
      if (!items.length) {
        box.innerHTML = '<div class="loader">Tidak ditemukan hasil. Coba kata kunci lain.</div>';
        return;
      }
      box.innerHTML = `<div class="v-list">${items.map((t, idx) => `
        <div class="v-row" onclick="playSearchItem(${idx})">
          <img src="${esc(t.cover)}" loading="lazy" />
          <div class="v-meta">
            <div class="v-title">${esc(t.title)}</div>
            <div class="v-sub">${esc(t.artist)} • ${esc(t.duration)}</div>
          </div>
          <button class="pill-btn" onclick="event.stopPropagation(); playSearchItem(${idx})">Putar</button>
        </div>
      `).join("")}</div>`;
    }

    function playSearchItem(idx) {
      const item = searchCache[idx];
      if (!item) return;
      const found = queue.findIndex(x => x.title === item.title && x.artist === item.artist);
      if (found !== -1) {
        playQueueIndex(found);
      } else {
        const pos = currentIndex >= 0 ? currentIndex + 1 : 0;
        queue.splice(pos, 0, item);
        playQueueIndex(pos);
      }
    }
    async function findFullAudio(track, vid) {
      const q = `${track.title} ${track.artist}`.trim();
      const racers = [
        (async () => {
          const r = await fetchWithTimeout(`https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(q)}&limit=5`, 3800);
          const d = await r.json();
          const tLow = track.title.toLowerCase();
          const hit = (d.data || []).find(x => x.id && (x.duration || 0) >= 60 && (x.title.toLowerCase().includes(tLow.slice(0, 4)) || tLow.includes(x.title.toLowerCase().slice(0, 4))));
          if (hit?.id) return { url: `https://discoveryprovider.audius.co/v1/tracks/${hit.id}/stream`, tag: "FULL TRACK • AUDIUS" };
          throw new Error("no-aud");
        })()
      ];

      if (vid && vid.length === 11) {
        const piped = ["https://pipedapi.kavin.rocks", "https://pipedapi.adminforge.de", "https://api.piped.private.coffee"];
        const inv = ["https://inv.nadeko.net", "https://yt.artemislena.eu", "https://invidious.nerdvpn.de"];
        for (const h of piped) {
          racers.push((async () => {
            const r = await fetchWithTimeout(`${h}/streams/${vid}`, 3800);
            const d = await r.json();
            const st = (d.audioStreams || []).filter(s => s.url);
            if (st[0]?.url) return { url: st[0].url, tag: "FULL AUDIO • HI-FI" };
            throw new Error("no-p");
          })());
        }
        for (const h of inv) {
          racers.push((async () => {
            const r = await fetchWithTimeout(`${h}/api/v1/videos/${vid}`, 3800);
            const d = await r.json();
            const fm = (d.adaptiveFormats || []).filter(f => f.url && (f.type?.includes("audio/mp4") || f.type?.includes("audio/webm")));
            if (fm[0]?.url) return { url: fm[0].url, tag: "FULL AUDIO • STREAM" };
            throw new Error("no-i");
          })());
        }
      }

      try {
        return await Promise.any(racers);
      } catch {
        return null;
      }
    }

    async function playQueueIndex(idx) {
      if (idx < 0 || idx >= queue.length) return;
      const token = ++playToken;
      currentIndex = idx;
      const track = queue[idx];

      document.getElementById("miniPlayer").style.display = "flex";
      document.getElementById("miniCover").src = track.cover;
      document.getElementById("miniTitle").textContent = track.title;
      document.getElementById("miniArtist").textContent = track.artist;
      document.getElementById("fpArt").src = track.cover;
      document.getElementById("fpTitle").textContent = track.title;
      document.getElementById("fpArtist").textContent = track.artist;
      document.getElementById("streamBadge").textContent = "MENCARI AUDIO FULL...";
      updateLikeBtn();
      syncMediaSession(track);
      saveRecent(track);

      bgAudio.pause();
      if (ytReady && ytPlayer?.stopVideo) { try { ytPlayer.stopVideo(); } catch {} }

      if (track.directAudio) {
        activeEngine = "native";
        document.getElementById("streamBadge").textContent = "FULL TRACK • DIRECT";
        bgAudio.src = track.directAudio;
        try { await bgAudio.play(); loadLyricsAndRelated(track); return; } catch {}
      }

      let vid = track.videoId;
      if (!vid || vid.length !== 11) {
        try {
          const r = await fetchWithTimeout(`/api/resolve?title=${encodeURIComponent(track.title)}&artist=${encodeURIComponent(track.artist)}`, 4000);
          if (r.ok) {
            const d = await r.json();
            if (d.directAudio) {
              track.directAudio = d.directAudio;
              activeEngine = "native";
              document.getElementById("streamBadge").textContent = "FULL TRACK • AUDIUS";
              bgAudio.src = d.directAudio;
              if (token === playToken) {
                try { await bgAudio.play(); loadLyricsAndRelated(track); return; } catch {}
              }
            }
            if (d.videoId?.length === 11) { vid = d.videoId; track.videoId = vid; }
          }
        } catch {}
      }
      if (token !== playToken) return;

      const stream = await findFullAudio(track, vid);
      if (token !== playToken) return;

      if (stream?.url) {
        activeEngine = "native";
        document.getElementById("streamBadge").textContent = stream.tag;
        bgAudio.src = stream.url;
        try { await bgAudio.play(); loadLyricsAndRelated(track); return; } catch {}
      }

      if (vid && vid.length === 11 && ytReady && ytPlayer) {
        activeEngine = "yt";
        document.getElementById("streamBadge").textContent = "FULL SONG • YOUTUBE ENGINE";
        ytPlayer.loadVideoById(vid);
        ytPlayer.playVideo();
        isPlaying = true;
        updatePlayBtns();
        loadLyricsAndRelated(track);
        return;
      }

      document.getElementById("streamBadge").textContent = "TIDAK TERSEDIA • LANJUT";
      setTimeout(() => { if (token === playToken && currentIndex === idx) playNext(); }, 1100);
    }

    function togglePlay() {
      if (activeEngine === "yt" && ytReady && ytPlayer) {
        if (isPlaying) { ytPlayer.pauseVideo(); isPlaying = false; }
        else { ytPlayer.playVideo(); isPlaying = true; }
        updatePlayBtns();
        return;
      }
      if (bgAudio.paused) bgAudio.play().catch(() => {});
      else bgAudio.pause();
    }

    function updatePlayBtns() {
      const icon = isPlaying ? "⏸" : "▶";
      document.getElementById("miniPlayBtn").textContent = icon;
      document.getElementById("fpPlayBtn").textContent = icon;
    }

    async function playNext() {
      if (!queue.length) return;
      if (repeatMode === 2 && currentIndex >= 0) { playQueueIndex(currentIndex); return; }
      if (autoplayOn && queue.length - currentIndex <= 3) {
        const cur = queue[currentIndex] || {};
        fetchCatalog(`${cur.artist || "Top Hits 2026"} mix`, 15).then(more => {
          if (more.length) { queue.push(...shuffle(more)); renderDrawer(); }
        });
      }
      if (isShuffle && queue.length > 1) {
        let nxt = Math.floor(Math.random() * queue.length);
        if (nxt === currentIndex) nxt = (currentIndex + 1) % queue.length;
        playQueueIndex(nxt);
      } else {
        playQueueIndex((currentIndex + 1) % queue.length);
      }
    }

    function playPrev() {
      if (!queue.length) return;
      if (bgAudio.currentTime > 4) { bgAudio.currentTime = 0; return; }
      playQueueIndex((currentIndex - 1 + queue.length) % queue.length);
    }

    function seekAudio(val) {
      if (activeEngine === "yt" && ytReady && ytPlayer?.getDuration) {
        const d = ytPlayer.getDuration();
        if (d) ytPlayer.seekTo((val / 100) * d, true);
        return;
      }
      if (bgAudio.duration) bgAudio.currentTime = (val / 100) * bgAudio.duration;
    }

    bgAudio.addEventListener("play", () => { isPlaying = true; updatePlayBtns(); });
    bgAudio.addEventListener("pause", () => { isPlaying = false; updatePlayBtns(); });
    bgAudio.addEventListener("ended", () => playNext());
    bgAudio.addEventListener("timeupdate", () => {
      if (!bgAudio.duration) return;
      document.getElementById("seekBar").value = (bgAudio.currentTime / bgAudio.duration) * 100;
      document.getElementById("curTime").textContent = fmtTime(bgAudio.currentTime);
      document.getElementById("totTime").textContent = fmtTime(bgAudio.duration);
    });

    setInterval(() => {
      if (activeEngine === "yt" && ytReady && ytPlayer?.getCurrentTime && isPlaying) {
        const c = ytPlayer.getCurrentTime() || 0;
        const d = ytPlayer.getDuration() || 0;
        if (d > 0) {
          document.getElementById("seekBar").value = (c / d) * 100;
          document.getElementById("curTime").textContent = fmtTime(c);
          document.getElementById("totTime").textContent = fmtTime(d);
        }
      }
    }, 1000);

    function syncMediaSession(track) {
      if (!("mediaSession" in navigator)) return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: "VIBE Music",
          artwork: [{ src: track.cover, sizes: "512x512", type: "image/jpeg" }]
        });
        navigator.mediaSession.setActionHandler("play", togglePlay);
        navigator.mediaSession.setActionHandler("pause", togglePlay);
        navigator.mediaSession.setActionHandler("nexttrack", playNext);
        navigator.mediaSession.setActionHandler("previoustrack", playPrev);
      } catch {}
    }

    async function loadLyricsAndRelated(track) {
      renderDrawer();
      try {
        const r = await fetchWithTimeout(`/api/related?videoId=${encodeURIComponent(track.videoId || "")}&q=${encodeURIComponent(track.title + " " + track.artist)}`, 4000);
        if (r.ok) {
          const d = await r.json();
          relatedCache = d.results || [];
          if (activeDrawer === "related") renderDrawer();
        }
      } catch {}
    }

    function switchDrawer(tab) {
      activeDrawer = tab;
      ["tabQueue", "tabLyrics", "tabRelated"].forEach(id => document.getElementById(id).classList.remove("active"));
      document.getElementById(tab === "queue" ? "tabQueue" : tab === "lyrics" ? "tabLyrics" : "tabRelated").classList.add("active");
      renderDrawer();
    }

    async function renderDrawer() {
      const box = document.getElementById("drawerBox");
      if (activeDrawer === "queue") {
        box.innerHTML = `<div class="v-list">${queue.slice(currentIndex + 1, currentIndex + 25).map((t, i) => `
          <div class="v-row" onclick="playQueueIndex(${currentIndex + 1 + i})">
            <img src="${esc(t.cover)}" loading="lazy" />
            <div class="v-meta">
              <div class="v-title">${esc(t.title)}</div>
              <div class="v-sub">${esc(t.artist)}</div>
            </div>
          </div>
        `).join("")}</div>`;
      } else if (activeDrawer === "related") {
        box.innerHTML = relatedCache.length ? `<div class="v-list">${relatedCache.map((t, i) => `
          <div class="v-row" onclick="playRelatedItem(${i})">
            <img src="${esc(t.cover || FALLBACK_COVER)}" loading="lazy" />
            <div class="v-meta">
              <div class="v-title">${esc(t.title)}</div>
              <div class="v-sub">${esc(t.artist)}</div>
            </div>
          </div>
        `).join("")}</div>` : '<div class="loader">Memuat lagu terkait...</div>';
      } else {
        const cur = queue[currentIndex];
        if (!cur) return;
        box.innerHTML = '<div class="loader">Mencari lirik...</div>';
        try {
          const lr = await fetchWithTimeout(`https://lrclib.net/api/get?track_name=${encodeURIComponent(cur.title)}&artist_name=${encodeURIComponent(cur.artist)}`, 3500);
          if (lr.ok) {
            const ld = await lr.json();
            box.innerHTML = `<div class="lyrics-text">${esc(ld.plainLyrics || "Lirik tidak tersedia untuk lagu ini.")}</div>`;
            return;
          }
        } catch {}
        box.innerHTML = '<div class="lyrics-text">Lirik belum tersedia.</div>';
      }
    }

    function playRelatedItem(i) {
      const item = relatedCache[i];
      if (!item) return;
      const pos = currentIndex >= 0 ? currentIndex + 1 : 0;
      queue.splice(pos, 0, { ...item, cover: item.cover || FALLBACK_COVER });
      playQueueIndex(pos);
    }

    function getLiked() { try { return JSON.parse(localStorage.getItem("vibe_liked") || "[]"); } catch { return []; } }
    function getRecent() { try { return JSON.parse(localStorage.getItem("vibe_recent") || "[]"); } catch { return []; } }
    function saveRecent(t) {
      const list = getRecent().filter(x => !(x.title === t.title && x.artist === t.artist));
      list.unshift(t);
      try { localStorage.setItem("vibe_recent", JSON.stringify(list.slice(0, 30))); } catch {}
    }
    function toggleLikeCurrent() {
      const cur = queue[currentIndex];
      if (!cur) return;
      let list = getLiked();
      const idx = list.findIndex(x => x.title === cur.title && x.artist === cur.artist);
      if (idx !== -1) list.splice(idx, 1);
      else list.unshift(cur);
      try { localStorage.setItem("vibe_liked", JSON.stringify(list)); } catch {}
      updateLikeBtn();
    }
    function updateLikeBtn() {
      const cur = queue[currentIndex];
      const liked = cur && getLiked().some(x => x.title === cur.title && x.artist === cur.artist);
      document.getElementById("fpLikeBtn").textContent = liked ? "❤️" : "🤍";
    }
    function renderLibrary(mode) {
      document.getElementById("libLikedBtn").classList.toggle("active", mode === "liked");
      document.getElementById("libRecentBtn").classList.toggle("active", mode === "recent");
      const list = mode === "liked" ? getLiked() : getRecent();
      const box = document.getElementById("libraryList");
      if (!list.length) {
        box.innerHTML = '<div class="loader">Belum ada lagu tersimpan di sini.</div>';
        return;
      }
      box.innerHTML = `<div class="v-list">${list.map((t, i) => `
        <div class="v-row" onclick="playLibraryItem('${mode}', ${i})">
          <img src="${esc(t.cover || FALLBACK_COVER)}" loading="lazy" />
          <div class="v-meta">
            <div class="v-title">${esc(t.title)}</div>
            <div class="v-sub">${esc(t.artist)}</div>
          </div>
        </div>
      `).join("")}</div>`;
    }
    function playLibraryItem(mode, i) {
      const list = mode === "liked" ? getLiked() : getRecent();
      if (!list[i]) return;
      queue = [...list];
      playQueueIndex(i);
    }

    const SLEEP_MINS = [0, 15, 30, 45, 60];
    let sleepStep = 0, sleepTimerId = null;
    function cycleSleep() {
      sleepStep = (sleepStep + 1) % SLEEP_MINS.length;
      clearTimeout(sleepTimerId);
      const m = SLEEP_MINS[sleepStep];
      const btn = document.getElementById("sleepBtn");
      if (!m) { btn.textContent = "⏱ Sleep: Off"; btn.classList.remove("active"); return; }
      btn.textContent = `⏱ Sleep: ${m}m`;
      btn.classList.add("active");
      sleepTimerId = setTimeout(() => { bgAudio.pause(); sleepStep = 0; btn.textContent = "⏱ Sleep: Off"; btn.classList.remove("active"); }, m * 60000);
    }

    const EQS = [{ n:"Normal", b:0, t:0 }, { n:"Bass Boost", b:7, t:2 }, { n:"Vocal", b:-2, t:5 }];
    let eqStep = 0, actx = null, bFilt = null, tFilt = null;
    function cycleEq() {
      if (!actx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          actx = new AC();
          const src = actx.createMediaElementSource(bgAudio);
          bFilt = actx.createBiquadFilter(); bFilt.type = "lowshelf"; bFilt.frequency.value = 150;
          tFilt = actx.createBiquadFilter(); tFilt.type = "highshelf"; tFilt.frequency.value = 4000;
          src.connect(bFilt); bFilt.connect(tFilt); tFilt.connect(actx.destination);
        } catch {}
      }
      if (actx?.state === "suspended") actx.resume().catch(() => {});
      eqStep = (eqStep + 1) % EQS.length;
      const p = EQS[eqStep];
      if (bFilt) bFilt.gain.value = p.b;
      if (tFilt) tFilt.gain.value = p.t;
      const btn = document.getElementById("eqBtn");
      btn.textContent = `🎛 EQ: ${p.n}`;
      btn.classList.toggle("active", eqStep !== 0);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById("shufBtn").style.color = isShuffle ? "#FF0055" : "#fff";
    }
    function cycleRepeat() {
      repeatMode = (repeatMode + 1) % 3;
      const btn = document.getElementById("repBtn");
      btn.textContent = repeatMode === 2 ? "🔂" : "🔁";
      btn.style.color = repeatMode > 0 ? "#FF0055" : "#fff";
    }
    function toggleAutoplay() {
      autoplayOn = !autoplayOn;
      const btn = document.getElementById("autoBtn");
      btn.textContent = `♾ Autoplay: ${autoplayOn ? "ON" : "OFF"}`;
      btn.classList.toggle("active", autoplayOn);
    }

    function switchTab(tab) {
      ["viewHome", "viewSearch", "viewLibrary"].forEach(id => document.getElementById(id).classList.remove("active"));
      ["navHome", "navSearch", "navLibrary"].forEach(id => document.getElementById(id).classList.remove("active"));
      if (tab === "home") {
        document.getElementById("viewHome").classList.add("active");
        document.getElementById("navHome").classList.add("active");
      } else if (tab === "search") {
        document.getElementById("viewSearch").classList.add("active");
        document.getElementById("navSearch").classList.add("active");
        document.getElementById("searchInput").focus();
      } else {
        document.getElementById("viewLibrary").classList.add("active");
        document.getElementById("navLibrary").classList.add("active");
        renderLibrary("liked");
      }
    }

    function openFullPlayer() { document.getElementById("fullPlayer").style.display = "flex"; renderDrawer(); }
    function closeFullPlayer() { document.getElementById("fullPlayer").style.display = "none"; }

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player("ytPlayerFrame", {
        height: "1", width: "1",
        playerVars: { autoplay: 0, controls: 0, playsinline: 1 },
        events: {
          onReady: () => { ytReady = true; },
          onStateChange: (e) => {
            if (activeEngine !== "yt") return;
            if (e.data === 1) { isPlaying = true; updatePlayBtns(); }
            if (e.data === 2) { isPlaying = false; updatePlayBtns(); }
            if (e.data === 0) playNext();
          }
        }
      });
    };
    const ytScript = document.createElement("script");
    ytScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytScript);

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("shufBtn").style.color = "#FF0055";
      loadMood(document.querySelector("#moodChips .chip.active"), "random");
    });
  </script>
</body>
