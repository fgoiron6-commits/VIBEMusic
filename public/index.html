<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Music</title>
  <style>
    :root {
      --bg: #030303;
      --surface: #121212;
      --surface-elevated: #1d1d1d;
      --chip-bg: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --muted: #aaaaaa;
      --accent: #FF0055;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 130px; overflow-x: hidden; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(3,3,3,0.98) 70%, rgba(3,3,3,0.85) 100%);
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.5px; }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
      display: grid; place-items: center;
    }
    .brand-icon svg { width: 14px; height: 14px; fill: #fff; margin-left: 2px; }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .icon-btn { background: none; border: none; color: #fff; cursor: pointer; display: grid; place-items: center; padding: 4px; }
    .search-bar-wrap { display: none; align-items: center; gap: 8px; width: 100%; }
    .search-bar-wrap.active { display: flex; }
    .search-input {
      flex: 1; background: var(--surface-elevated); border: none; color: #fff;
      padding: 9px 14px; border-radius: 99px; font-size: 0.92rem; outline: none;
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 6px 16px 14px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--chip-bg); border: 1px solid var(--border); color: #fff;
      padding: 7px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 500;
      white-space: nowrap; cursor: pointer; transition: 0.15s;
    }
    .chip.active { background: #ffffff; color: #030303; font-weight: 700; }
    .section { margin-bottom: 24px; }
    .section-header { padding: 0 16px 12px; display: flex; flex-direction: column; }
    .section-sub { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
    .section-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.3px; }
    .quick-grid {
      display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, 1fr);
      grid-auto-columns: 84%; gap: 10px 14px;
      overflow-x: auto; padding: 0 16px; scroll-snap-type: x mandatory; scrollbar-width: none;
    }
    .quick-grid::-webkit-scrollbar { display: none; }
    .song-row {
      display: flex; align-items: center; gap: 12px; scroll-snap-align: start;
      padding: 4px; border-radius: 8px; cursor: pointer;
    }
    .song-row:active { background: var(--surface-elevated); }
    .song-row img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #1e1e1e; flex-shrink: 0; }
    .song-meta { flex: 1; min-width: 0; }
    .song-title { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-title.playing-text { color: var(--accent); }
    .song-artist { font-size: 0.8rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cards-row { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
    .cards-row::-webkit-scrollbar { display: none; }
    .v-card { width: 140px; flex-shrink: 0; cursor: pointer; }
    .v-card img { width: 140px; height: 140px; border-radius: 8px; object-fit: cover; background: #1e1e1e; margin-bottom: 8px; }
    .v-card-title { font-size: 0.86rem; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; }
    .v-card-sub { font-size: 0.76rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .mini-player {
      position: fixed; bottom: 56px; left: 0; right: 0; height: 60px;
      background: #1b1b1f; border-top: 1px solid var(--border);
      display: none; align-items: center; padding: 0 12px; gap: 12px; z-index: 40;
    }
    .mini-player img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
    .mini-info { flex: 1; min-width: 0; cursor: pointer; }
    .mini-title { font-size: 0.88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 0.76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-controls { display: flex; align-items: center; gap: 10px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background: #0a0a0a; border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 45;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: var(--muted); font-size: 0.68rem; background: none; border: none; cursor: pointer;
    }
    .nav-item.active { color: #ffffff; font-weight: 700; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .full-player {
      position: fixed; inset: 0; background: linear-gradient(180deg, #1f1419 0%, #030303 55%);
      z-index: 80; display: none; flex-direction: column; padding: 16px 22px 24px;
    }
    .fp-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .fp-badge { font-size: 0.72rem; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 99px; font-weight: 600; }
    .fp-art-wrap { flex: 1; display: grid; place-items: center; max-height: 310px; margin: 6px 0 18px; }
    .fp-art { width: 270px; height: 270px; border-radius: 14px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.75); }
    .fp-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
    .fp-title { font-size: 1.35rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fp-artist { font-size: 0.95rem; color: var(--muted); margin-top: 4px; }
    .fp-controls { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 22px; padding: 0 12px; }
    .play-circle {
      width: 66px; height: 66px; border-radius: 50%; background: #ffffff; color: #030303;
      display: grid; place-items: center; border: none; cursor: pointer;
    }
    .fp-tabs { display: flex; border-top: 1px solid var(--border); padding-top: 12px; justify-content: space-around; }
    .fp-tab-btn { background: none; border: none; color: var(--muted); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px; cursor: pointer; padding: 6px 16px; }
    .fp-tab-btn.active { color: #fff; border-bottom: 2px solid #fff; }
    .fp-drawer {
      display: none; position: fixed; inset: 70px 0 0 0; background: #0c0c0e;
      border-top-left-radius: 18px; border-top-right-radius: 18px; padding: 18px;
      z-index: 90; flex-direction: column;
    }
    .fp-drawer-body { flex: 1; overflow-y: auto; margin-top: 12px; white-space: pre-line; line-height: 1.75; color: #e5e5ea; font-size: 0.95rem; }
    #yt-engine { position: fixed; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; bottom: 0; left: 0; }
    .loader { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="yt-engine"><div id="yt-player"></div></div>

  <div class="topbar">
    <div class="brand" id="brandLogo">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <span>Music</span>
    </div>
    <div class="search-bar-wrap" id="searchWrap">
      <button class="icon-btn" onclick="closeSearch()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <input type="text" id="searchInput" class="search-input" placeholder="Cari lagu, artis, lirik..." onkeydown="if(event.key==='Enter') doSearch()" />
    </div>
    <div class="top-actions" id="topActions">
      <button class="icon-btn" onclick="openSearch()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>

  <div class="chips" id="moodChips">
    <div class="chip active" onclick="filterMood(this, '')">Semua</div>
    <div class="chip" onclick="filterMood(this, 'lagu galau indonesia populer')">Galau & Santai</div>
    <div class="chip" onclick="filterMood(this, 'lagu semangat olahraga workout')">Energi</div>
    <div class="chip" onclick="filterMood(this, 'rnb chill frank ocean daniel caesar')">Chill R&B</div>
    <div class="chip" onclick="filterMood(this, 'tiktok viral indonesia terbaru')">Viral TikTok</div>
    <div class="chip" onclick="filterMood(this, 'tulus nadin amizah pamungkas hindia')">Indo Indie</div>
  </div>

  <div id="viewHome">
    <div id="homeContent"><div class="loader">Menyiapkan rekomendasi musik untukmu...</div></div>
  </div>

  <div id="viewSearch" style="display:none;">
    <div class="section-header">
      <span class="section-sub">KATALOG YOUTUBE MUSIC</span>
      <span class="section-title" id="searchHeading">Hasil Pencarian</span>
    </div>
    <div class="v-list" id="searchResults"></div>
  </div>

  <div id="viewLibrary" style="display:none;">
    <div class="section-header">
      <span class="section-sub">KOLEKSI TERSIMPAN</span>
      <span class="section-title">Lagu Disukai</span>
    </div>
    <div class="v-list" id="libraryList"></div>
  </div>

  <div class="mini-player" id="miniPlayer">
    <img id="miniCover" src="" alt="" onclick="openFullPlayer()" />
    <div class="mini-info" onclick="openFullPlayer()">
      <div class="mini-title" id="miniTitle">Judul Lagu</div>
      <div class="mini-artist" id="miniArtist">Artis</div>
    </div>
    <div class="mini-controls">
      <button class="icon-btn" onclick="togglePlay()" id="miniPlayBtn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="icon-btn" onclick="playNext()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="navHome" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" id="navExplore" onclick="openSearch()">
      <svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
      <span>Explore</span>
    </button>
    <button class="nav-item" id="navLibrary" onclick="switchTab('library')">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
      <span>Library</span>
    </button>
  </nav>

  <div class="full-player" id="fullPlayer">
    <div class="fp-top">
      <button class="icon-btn" onclick="closeFullPlayer()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </button>
      <span class="fp-badge">SONG • TERMUX LIVE</span>
      <button class="icon-btn" onclick="openDrawer('lyrics')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/></svg>
      </button>
    </div>
    <div class="fp-art-wrap">
      <img id="fpArt" class="fp-art" src="" alt="Cover" />
    </div>
    <div class="fp-meta">
      <div style="min-width:0; flex:1;">
        <div class="fp-title" id="fpTitle">Judul Lagu</div>
        <div class="fp-artist" id="fpArtist">Artis</div>
      </div>
      <button class="icon-btn" id="likeBtn" onclick="toggleLike()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
      </button>
    </div>
    <div class="fp-controls">
      <button class="icon-btn" onclick="playPrev()">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-circle" onclick="togglePlay()" id="fpPlayBtn">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="icon-btn" onclick="playNext()">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div class="fp-tabs">
      <button class="fp-tab-btn" onclick="openDrawer('queue')">UP NEXT</button>
      <button class="fp-tab-btn" onclick="openDrawer('lyrics')">LYRICS</button>
    </div>
  </div>

  <div class="fp-drawer" id="fpDrawer">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px;">
      <strong id="drawerTitle">LYRICS</strong>
      <button class="icon-btn" onclick="closeDrawer()" style="font-size:0.85rem; font-weight:700;">TUTUP</button>
    </div>
    <div class="fp-drawer-body" id="drawerBody"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer = null;
    let isPlayerReady = false;
    let isPlaying = false;
    let queue = [];
    let currentIndex = -1;
    let likedSongs = JSON.parse(localStorage.getItem("vibe_liked") || "[]");

    const ICON_PLAY = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("yt-player", {
        height: "1",
        width: "1",
        playerVars: { autoplay: 1, controls: 0, playsinline: 1 },
        events: {
          onReady: () => { isPlayerReady = true; },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              updatePlayIcons();
            } else if (e.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              updatePlayIcons();
            } else if (e.data === YT.PlayerState.ENDED) {
              playNext();
            }
          }
        }
      });
    }

    window.addEventListener("DOMContentLoaded", loadHome);

    async function loadHome() {
      const container = document.getElementById("homeContent");
      try {
        const res = await fetch("/api/home");
        const data = await res.json();
        const qp = data.quick_picks || [];
        const tr = data.trending || [];
        const ch = data.chill || [];
        queue = [...qp, ...tr, ...ch];

        container.innerHTML = `
          <div class="section">
            <div class="section-header">
              <span class="section-sub">MULAI RADIO DARI LAGU</span>
              <span class="section-title">Quick picks</span>
            </div>
            <div class="quick-grid">
              ${qp.map(t => renderSongRow(t)).join("")}
            </div>
          </div>
          <div class="section">
            <div class="section-header">
              <span class="section-sub">LAGI RAME DIPUTAR</span>
              <span class="section-title">Trending Indonesia</span>
            </div>
            <div class="cards-row">
              ${tr.map(t => renderVCard(t)).join("")}
            </div>
          </div>
          <div class="section">
            <div class="section-header">
              <span class="section-sub">SANTAI & VIBE MALAM</span>
              <span class="section-title">Chill & Indie Mix</span>
            </div>
            <div class="cards-row">
              ${ch.map(t => renderVCard(t)).join("")}
            </div>
          </div>
        `;
      } catch {
        container.innerHTML = '<div class="loader">Server Termux belum jalan. Ketik <b>python server.py</b> di Termux.</div>';
      }
    }

    function renderSongRow(t) {
      const safe = encodeURIComponent(JSON.stringify(t));
      return `
        <div class="song-row" onclick="selectTrack('${safe}')">
          <img src="${t.cover}" loading="lazy" />
          <div class="song-meta">
            <div class="song-title">${t.title}</div>
            <div class="song-artist">${t.artist} • ${t.duration}</div>
          </div>
        </div>
      `;
    }

    function renderVCard(t) {
      const safe = encodeURIComponent(JSON.stringify(t));
      return `
        <div class="v-card" onclick="selectTrack('${safe}')">
          <img src="${t.cover}" loading="lazy" />
          <div class="v-card-title">${t.title}</div>
          <div class="v-card-sub">${t.artist}</div>
        </div>
      `;
    }

    function selectTrack(encoded) {
      const track = JSON.parse(decodeURIComponent(encoded));
      let idx = queue.findIndex(x => x.videoId === track.videoId);
      if (idx === -1) {
        queue.unshift(track);
        idx = 0;
      }
      playAtIndex(idx);
    }

    function playAtIndex(idx) {
      if (idx < 0 || idx >= queue.length) return;
      currentIndex = idx;
      const track = queue[idx];

      document.getElementById("miniPlayer").style.display = "flex";
      document.getElementById("miniCover").src = track.cover;
      document.getElementById("miniTitle").textContent = track.title;
      document.getElementById("miniArtist").textContent = track.artist;

      document.getElementById("fpArt").src = track.cover;
      document.getElementById("fpTitle").textContent = track.title;
      document.getElementById("fpArtist").textContent = track.artist;
      updateLikeIcon();

      if (isPlayerReady && ytPlayer) {
        ytPlayer.loadVideoById(track.videoId);
        isPlaying = true;
        updatePlayIcons();
      }
    }

    function togglePlay() {
      if (!isPlayerReady || !ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function playNext() {
      if (queue.length === 0) return;
      playAtIndex((currentIndex + 1) % queue.length);
    }

    function playPrev() {
      if (queue.length === 0) return;
      playAtIndex((currentIndex - 1 + queue.length) % queue.length);
    }

    function updatePlayIcons() {
      document.getElementById("miniPlayBtn").innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
      document.getElementById("fpPlayBtn").innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    }

    function openSearch() {
      document.getElementById("brandLogo").style.display = "none";
      document.getElementById("topActions").style.display = "none";
      document.getElementById("searchWrap").classList.add("active");
      document.getElementById("searchInput").focus();
      switchTab("search");
    }

    function closeSearch() {
      document.getElementById("brandLogo").style.display = "flex";
      document.getElementById("topActions").style.display = "flex";
      document.getElementById("searchWrap").classList.remove("active");
      switchTab("home");
    }

    async function doSearch(customQuery) {
      const q = customQuery || document.getElementById("searchInput").value.trim();
      if (!q) return;
      switchTab("search");
      document.getElementById("searchHeading").textContent = `Hasil: "${q}"`;
      const box = document.getElementById("searchResults");
      box.innerHTML = '<div class="loader">Mencari di YouTube Music...</div>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        const items = data.results || [];
        if (items.length === 0) {
          box.innerHTML = '<div class="loader">Tidak ada hasil ditemukan.</div>';
          return;
        }
        queue = items;
        box.innerHTML = items.map(t => renderSongRow(t)).join("");
      } catch {
        box.innerHTML = '<div class="loader">Gagal mengambil data dari server.</div>';
      }
    }

    function filterMood(el, query) {
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      if (!query) {
        closeSearch();
        switchTab("home");
      } else {
        doSearch(query);
      }
    }

    function switchTab(tab) {
      document.getElementById("viewHome").style.display = tab === "home" ? "block" : "none";
      document.getElementById("viewSearch").style.display = tab === "search" ? "block" : "none";
      document.getElementById("viewLibrary").style.display = tab === "library" ? "block" : "none";

      document.getElementById("navHome").classList.toggle("active", tab === "home");
      document.getElementById("navExplore").classList.toggle("active", tab === "search");
      document.getElementById("navLibrary").classList.toggle("active", tab === "library");

      if (tab === "library") renderLibrary();
    }

    function openFullPlayer() {
      document.getElementById("fullPlayer").style.display = "flex";
    }

    function closeFullPlayer() {
      document.getElementById("fullPlayer").style.display = "none";
      closeDrawer();
    }

    function toggleLike() {
      if (currentIndex < 0) return;
      const track = queue[currentIndex];
      const exists = likedSongs.findIndex(x => x.videoId === track.videoId);
      if (exists > -1) {
        likedSongs.splice(exists, 1);
      } else {
        likedSongs.unshift(track);
      }
      localStorage.setItem("vibe_liked", JSON.stringify(likedSongs));
      updateLikeIcon();
    }

    function updateLikeIcon() {
      if (currentIndex < 0) return;
      const track = queue[currentIndex];
      const isLiked = likedSongs.some(x => x.videoId === track.videoId);
      document.getElementById("likeBtn").style.color = isLiked ? "#FF0055" : "#ffffff";
    }

    function renderLibrary() {
      const box = document.getElementById("libraryList");
      if (likedSongs.length === 0) {
        box.innerHTML = '<div class="loader">Belum ada lagu yang disukai. Tekan ikon hati di pemutar lagu untuk menyimpan.</div>';
        return;
      }
      box.innerHTML = likedSongs.map(t => renderSongRow(t)).join("");
    }

    async function openDrawer(type) {
      const drawer = document.getElementById("fpDrawer");
      const title = document.getElementById("drawerTitle");
      const body = document.getElementById("drawerBody");
      drawer.style.display = "flex";

      if (type === "queue") {
        title.textContent = "UP NEXT (ANTREAN)";
        body.innerHTML = queue.map((t, i) => `
          <div class="song-row" onclick="playAtIndex(${i}); closeDrawer();" style="margin-bottom:8px;">
            <img src="${t.cover}" />
            <div class="song-meta">
              <div class="song-title ${i === currentIndex ? 'playing-text' : ''}">${t.title}</div>
              <div class="song-artist">${t.artist}</div>
            </div>
          </div>
        `).join("");
      } else if (type === "lyrics") {
        title.textContent = "LIRIK LAGU";
        if (currentIndex < 0) return;
        const vid = queue[currentIndex].videoId;
        body.textContent = "Memuat lirik dari YouTube Music...";
        try {
          const res = await fetch(`/api/lyrics/${vid}`);
          const data = await res.json();
          body.textContent = data.lyrics;
        } catch {
          body.textContent = "Gagal memuat lirik.";
        }
      }
    }

    function closeDrawer() {
      document.getElementById("fpDrawer").style.display = "none";
    }
  </script>
</body>
</html>
