<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VIBE Music</title>
  <style>
    :root {
      --bg: #030303;
      --surface: #121214;
      --surface-elevated: #1c1c21;
      --chip-bg: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #9e9ea8;
      --accent: #FF0055;
      --accent-glow: rgba(255, 0, 85, 0.25);
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at 50% -10%, #2b0918 0%, #030303 42%);
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 135px;
      overflow-x: hidden;
    }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: rgba(3, 3, 3, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.5px; }
    .brand-icon { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 0 14px var(--accent-glow); }
    .brand-icon svg { width: 14px; height: 14px; fill: #fff; margin-left: 2px; }
    .icon-btn { background: none; border: none; color: #fff; cursor: pointer; display: grid; place-items: center; padding: 5px; }
    .search-bar-wrap { display: none; align-items: center; gap: 8px; width: 100%; }
    .search-bar-wrap.active { display: flex; }
    .search-input { flex: 1; background: var(--surface-elevated); border: 1px solid var(--border); color: #fff; padding: 9px 14px; border-radius: 99px; font-size: 0.92rem; outline: none; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 14px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { background: var(--chip-bg); border: 1px solid var(--border); color: #fff; padding: 7px 14px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #ffffff; box-shadow: 0 4px 12px var(--accent-glow); }

    /* Hero Banner */
    .hero-banner {
      margin: 0 16px 20px; padding: 16px; border-radius: 16px;
      background: linear-gradient(135deg, #2b0b19 0%, #141419 100%);
      border: 1px solid rgba(255, 0, 85, 0.25);
      display: flex; align-items: center; gap: 14px; cursor: pointer;
    }
    .hero-banner img { width: 78px; height: 78px; border-radius: 12px; object-fit: cover; box-shadow: 0 8px 20px rgba(0,0,0,0.6); flex-shrink: 0; }
    .hero-info { flex: 1; min-width: 0; }
    .hero-tag { font-size: 0.68rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .hero-title { font-size: 1.08rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-play { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 4px 14px var(--accent-glow); }

    /* Compact 2-Column Grid */
    .compact-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 16px; margin-bottom: 24px; }
    .compact-card {
      background: var(--surface-elevated); border-radius: 8px; overflow: hidden;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .compact-card img { width: 48px; height: 48px; object-fit: cover; flex-shrink: 0; }
    .compact-title { font-size: 0.78rem; font-weight: 700; padding-right: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; }

    .section { margin-bottom: 26px; }
    .section-header { padding: 0 16px 12px; display: flex; justify-content: space-between; align-items: flex-end; }
    .section-sub { font-size: 0.68rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px; margin-bottom: 2px; display: block; }
    .section-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.3px; }

    /* Horizontal Quick Picks */
    .quick-grid {
      display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, 1fr);
      grid-auto-columns: 82%; gap: 10px 14px;
      overflow-x: auto; padding: 0 16px; scroll-snap-type: x mandatory; scrollbar-width: none;
    }
    .quick-grid::-webkit-scrollbar { display: none; }

    /* Vertical Track Rows */
    .song-row {
      display: flex; align-items: center; gap: 12px; scroll-snap-align: start;
      padding: 6px 8px; border-radius: 10px; cursor: pointer;
      transition: background 0.15s;
    }
    .song-row:active { background: var(--surface-elevated); }
    .track-num { width: 22px; text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .song-row img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #1e1e1e; flex-shrink: 0; }
    .song-meta { flex: 1; min-width: 0; }
    .song-title { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-title.playing-text { color: var(--accent); }
    .song-artist { font-size: 0.78rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-dur { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }

    /* Horizontal Cards */
    .cards-row { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
    .cards-row::-webkit-scrollbar { display: none; }
    .v-card { width: 138px; flex-shrink: 0; cursor: pointer; }
    .v-card img { width: 138px; height: 138px; border-radius: 10px; object-fit: cover; background: #1e1e1e; margin-bottom: 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .v-card-title { font-size: 0.85rem; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; }
    .v-card-sub { font-size: 0.75rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .v-list { padding: 0 12px; display: flex; flex-direction: column; gap: 4px; }

    /* Mini & Full Player */
    .mini-player {
      position: fixed; bottom: 56px; left: 8px; right: 8px; height: 60px;
      background: #1c1c22; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      display: none; align-items: center; padding: 0 12px; gap: 12px; z-index: 40;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8); overflow: hidden;
    }
    .mini-progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--accent); width: 0%; transition: width 0.25s linear; }
    .mini-player img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; }
    .mini-info { flex: 1; min-width: 0; cursor: pointer; }
    .mini-title { font-size: 0.88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-controls { display: flex; align-items: center; gap: 8px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background: rgba(8, 8, 10, 0.96); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 45;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 0.68rem; background: none; border: none; cursor: pointer; }
    .nav-item.active { color: var(--accent); font-weight: 700; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    .full-player {
      position: fixed; inset: 0; background: linear-gradient(180deg, #2a0a18 0%, #030303 60%);
      z-index: 80; display: none; flex-direction: column; padding: 16px 22px 24px;
    }
    .fp-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .fp-badge { font-size: 0.72rem; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 99px; font-weight: 700; }
    .fp-art-wrap { flex: 1; display: grid; place-items: center; max-height: 290px; margin: 4px 0 14px; }
    .fp-art { width: 255px; height: 255px; border-radius: 16px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .fp-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
    .fp-title { font-size: 1.3rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fp-artist { font-size: 0.92rem; color: var(--muted); margin-top: 4px; }
    .seek-wrap { margin-bottom: 10px; }
    .seek-slider { width: 100%; accent-color: var(--accent); height: 4px; cursor: pointer; }
    .time-row { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); margin-top: 4px; }
    .fp-controls { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 18px; padding: 0 12px; }
    .play-circle { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #ffffff; display: grid; place-items: center; border: none; cursor: pointer; box-shadow: 0 6px 20px var(--accent-glow); }
    .fp-tabs { display: flex; border-top: 1px solid var(--border); padding-top: 10px; justify-content: space-around; }
    .fp-tab-btn { background: none; border: none; color: var(--muted); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px; cursor: pointer; padding: 6px 16px; }
    .fp-drawer {
      display: none; position: fixed; inset: 70px 0 0 0; background: #0c0c0e;
      border-top-left-radius: 18px; border-top-right-radius: 18px; padding: 18px;
      z-index: 90; flex-direction: column;
    }
    .fp-drawer-body { flex: 1; overflow-y: auto; margin-top: 12px; white-space: pre-line; line-height: 1.75; color: #e5e5ea; font-size: 0.95rem; }
    .loader { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 0.9rem; }
    #ytHiddenWrap { position: fixed; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; bottom: 0; left: 0; }
  </style>
</head>
<body>
  <div id="ytHiddenWrap"><div id="ytPlayer"></div></div>
  <audio id="audiusEngine" preload="auto"></audio>

  <div class="topbar">
    <div class="brand" id="brandLogo">
      <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <span>VIBE Music</span>
    </div>
    <div class="search-bar-wrap" id="searchWrap">
      <button class="icon-btn" onclick="closeSearch()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <input type="text" id="searchInput" class="search-input" placeholder="Cari lagu full, artis..." onkeydown="if(event.key==='Enter') doSearch()" />
    </div>
    <div id="topActions">
      <button class="icon-btn" onclick="openSearch()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>

  <div class="chips" id="moodChips">
    <div class="chip active" onclick="filterMood(this, '')">Untukmu</div>
    <div class="chip" onclick="filterMood(this, 'Tulus Nadin Amizah Hindia')">Indo Indie</div>
    <div class="chip" onclick="filterMood(this, 'Daniel Caesar Frank Ocean Rex Orange County')">Chill R&B</div>
    <div class="chip" onclick="filterMood(this, 'Olivia Rodrigo LANY Justin Bieber')">Global Pop</div>
    <div class="chip" onclick="filterMood(this, 'lagu galau indonesia viral')">Galau Viral</div>
    <div class="chip" onclick="filterMood(this, 'Pamungkas Feby Putri Sal Priadi')">Akustik</div>
  </div>

  <div id="viewHome"><div id="homeContent"><div class="loader">Menyiapkan deretan lagu pilihanmu...</div></div></div>
  <div id="viewSearch" style="display:none;">
    <div class="section-header"><div><span class="section-sub">FULL TRACK CATALOG</span><span class="section-title" id="searchHeading">Hasil Pencarian</span></div></div>
    <div class="v-list" id="searchResults"></div>
  </div>
  <div id="viewLibrary" style="display:none;">
    <div class="section-header"><div><span class="section-sub">KOLEKSI TERSIMPAN</span><span class="section-title">Lagu Disukai</span></div></div>
    <div class="v-list" id="libraryList"></div>
  </div>

  <div class="mini-player" id="miniPlayer">
    <div class="mini-progress-bar" id="miniProgress"></div>
    <img id="miniCover" src="" alt="" onclick="openFullPlayer()" />
    <div class="mini-info" onclick="openFullPlayer()">
      <div class="mini-title" id="miniTitle">Judul Lagu</div>
      <div class="mini-artist" id="miniArtist">Artis</div>
    </div>
    <div class="mini-controls">
      <button class="icon-btn" onclick="togglePlay()" id="miniPlayBtn"></button>
      <button class="icon-btn" onclick="playNext()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="navHome" onclick="switchTab('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></button>
    <button class="nav-item" id="navExplore" onclick="openSearch()"><svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg><span>Explore</span></button>
    <button class="nav-item" id="navLibrary" onclick="switchTab('library')"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg><span>Library</span></button>
  </nav>

  <div class="full-player" id="fullPlayer">
    <div class="fp-top">
      <button class="icon-btn" onclick="closeFullPlayer()"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></button>
      <span class="fp-badge" id="streamSourceBadge">FULL AUDIO • STREAM</span>
      <button class="icon-btn" onclick="openDrawer('lyrics')"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/></svg></button>
    </div>
    <div class="fp-art-wrap"><img id="fpArt" class="fp-art" src="" alt="Cover" /></div>
    <div class="fp-meta">
      <div style="min-width:0; flex:1;">
        <div class="fp-title" id="fpTitle">Judul Lagu</div>
        <div class="fp-artist" id="fpArtist">Artis</div>
      </div>
      <button class="icon-btn" id="likeBtn" onclick="toggleLike()"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg></button>
    </div>
    <div class="seek-wrap">
      <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" oninput="seekTo(this.value)" />
      <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>
    <div class="fp-controls">
      <button class="icon-btn" onclick="playPrev()"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="play-circle" onclick="togglePlay()" id="fpPlayBtn"></button>
      <button class="icon-btn" onclick="playNext()"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="fp-tabs">
      <button class="fp-tab-btn" onclick="openDrawer('queue')">UP NEXT</button>
      <button class="fp-tab-btn" onclick="openDrawer('lyrics')">LYRICS</button>
    </div>
  </div>

  <div class="fp-drawer" id="fpDrawer">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px;">
      <strong id="drawerTitle">LYRICS</strong>
      <button class="icon-btn" onclick="closeDrawer()" style="font-size:0.85rem; font-weight:700;">TUTUP</button>
    </div>
    <div class="fp-drawer-body" id="drawerBody"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer = null, ytReady = false, activeEngine = "yt";
    const audiusAudio = document.getElementById("audiusEngine");
    let trackStore = {}, queue = [], currentIndex = -1, isPlaying = false;
    let likedSongs = JSON.parse(localStorage.getItem("vibe_liked") || "[]");

    const ICON_PLAY = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    function registerTrack(t) {
      const uid = "trk_" + Math.random().toString(36).slice(2, 10);
      trackStore[uid] = t;
      return uid;
    }
    function escHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("ytPlayer", {
        height: "1", width: "1",
        playerVars: { autoplay: 1, controls: 0, playsinline: 1, rel: 0 },
        events: {
          onReady: () => { ytReady = true; },
          onStateChange: (e) => {
            if (activeEngine !== "yt") return;
            if (e.data === YT.PlayerState.PLAYING) { isPlaying = true; updatePlayIcons(); }
            if (e.data === YT.PlayerState.PAUSED) { isPlaying = false; updatePlayIcons(); }
            if (e.data === YT.PlayerState.ENDED) { playNext(); }
          },
          onError: () => { if (currentIndex >= 0) playViaAudius(queue[currentIndex]); }
        }
      });
    }
    audiusAudio.addEventListener("play", () => { if (activeEngine === "audius") { isPlaying = true; updatePlayIcons(); } });
    audiusAudio.addEventListener("pause", () => { if (activeEngine === "audius") { isPlaying = false; updatePlayIcons(); } });
    audiusAudio.addEventListener("ended", () => { if (activeEngine === "audius") playNext(); });

    setInterval(() => {
      let cur = 0, dur = 0;
      if (activeEngine === "yt" && ytReady && ytPlayer && ytPlayer.getCurrentTime) {
        cur = ytPlayer.getCurrentTime() || 0; dur = ytPlayer.getDuration() || 0;
      } else if (activeEngine === "audius") {
        cur = audiusAudio.currentTime || 0; dur = audiusAudio.duration || 0;
      }
      if (dur > 0) {
        const pct = (cur / dur) * 100;
        document.getElementById("seekSlider").value = pct;
        document.getElementById("miniProgress").style.width = pct + "%";
        document.getElementById("curTime").textContent = fmtSec(cur);
        document.getElementById("durTime").textContent = fmtSec(dur);
      }
    }, 500);

    function fmtSec(s) {
      const m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return `${m}:${String(sec).padStart(2, "0")}`;
    }
    function seekTo(pct) {
      if (activeEngine === "yt" && ytReady && ytPlayer && ytPlayer.getDuration) ytPlayer.seekTo((pct / 100) * ytPlayer.getDuration(), true);
      else if (activeEngine === "audius" && audiusAudio.duration) audiusAudio.currentTime = (pct / 100) * audiusAudio.duration;
    }

    async function fetchCatalog(query, limit = 15) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.results && data.results.length > 0 && !data.results[0].audioUrl) {
            return data.results.map(x => ({ ...x, source: "yt" }));
          }
        }
      } catch {}
      const itunes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=${limit}&country=ID`);
      const json = await itunes.json();
      return (json.results || []).map(item => ({
        videoId: "", trackId: String(item.trackId), title: item.trackName, artist: item.artistName,
        duration: fmtSec((item.trackTimeMillis || 0) / 1000),
        cover: (item.artworkUrl100 || "").replace("100x100bb", "500x500bb"),
        previewUrl: item.previewUrl || "", source: "resolve"
      }));
    }

    async function resolveYouTubeVideoId(title, artist) {
      const q = `${title} ${artist} official audio`;
      try {
        const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        if (r.ok) {
          const d = await r.json();
          const hit = (d.results || []).find(x => x.videoId && x.videoId.length === 11);
          if (hit) return hit.videoId;
        }
      } catch {}
      const instances = ["https://pipedapi.kavin.rocks", "https://pipedapi.adminforge.de", "https://api.piped.private.coffee"];
      for (const host of instances) {
        try {
          const ctrl = new AbortController();
          const tmr = setTimeout(() => ctrl.abort(), 3500);
          const res = await fetch(`${host}/search?q=${encodeURIComponent(q)}&filter=music_songs`, { signal: ctrl.signal });
          clearTimeout(tmr);
          const data = await res.json();
          const item = (data.items || [])[0];
          if (item && item.url) {
            const vid = item.url.split("v=")[1]?.slice(0, 11);
            if (vid) return vid;
          }
        } catch {}
      }
      return null;
    }

    async function playViaAudius(track) {
      activeEngine = "audius";
      if (ytReady && ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      document.getElementById("streamSourceBadge").textContent = "FULL AUDIO • AUDIUS";
      try {
        const res = await fetch(`https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(track.title + " " + track.artist)}&limit=1`);
        const json = await res.json();
        const hit = (json.data || [])[0];
        if (hit && hit.id) {
          audiusAudio.src = `https://discoveryprovider.audius.co/v1/tracks/${hit.id}/stream`;
          await audiusAudio.play();
          return;
        }
      } catch {}
      if (track.previewUrl) {
        document.getElementById("streamSourceBadge").textContent = "PREVIEW AUDIO";
        audiusAudio.src = track.previewUrl;
        audiusAudio.play();
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("homeContent");
      try {
        const [qp, tr, ch, extra] = await Promise.all([
          fetchCatalog("Tulus Nadin Amizah Hindia", 12),
          fetchCatalog("Top Hits Indonesia 2026", 12),
          fetchCatalog("Daniel Caesar Frank Ocean LANY", 12),
          fetchCatalog("Pamungkas Sal Priadi Olivia Rodrigo", 25)
        ]);
        queue = [...qp, ...tr, ...ch, ...extra];
        const hero = qp[0] || tr[0];
        const heroUid = registerTrack(hero);
        const topSix = [...tr.slice(0, 3), ...ch.slice(0, 3)];

        container.innerHTML = `
          ${hero ? `
          <div class="hero-banner" onclick="selectTrackById('${heroUid}')">
            <img src="${escHtml(hero.cover)}" />
            <div class="hero-info">
              <div class="hero-tag">PILIHAN UTAMA HARI INI</div>
              <div class="hero-title">${escHtml(hero.title)}</div>
              <div class="hero-sub">${escHtml(hero.artist)} • Putar Penuh</div>
            </div>
            <div class="hero-play"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
          </div>` : ""}

          <div class="compact-grid">
            ${topSix.map(t => {
              const uid = registerTrack(t);
              return `<div class="compact-card" onclick="selectTrackById('${uid}')"><img src="${escHtml(t.cover)}" /><div class="compact-title">${escHtml(t.title)}</div></div>`;
            }).join("")}
          </div>

          <div class="section">
            <div class="section-header"><div><span class="section-sub">PILIHAN CEPAT</span><span class="section-title">Quick picks</span></div></div>
            <div class="quick-grid">${qp.map(t => renderSongRow(t)).join("")}</div>
          </div>

          <div class="section">
            <div class="section-header"><div><span class="section-sub">LAGI POPULER</span><span class="section-title">Trending Indonesia</span></div></div>
            <div class="cards-row">${tr.map(t => renderVCard(t)).join("")}</div>
          </div>

          <div class="section">
            <div class="section-header"><div><span class="section-sub">SANTAI & VIBE</span><span class="section-title">Chill & R&B Mix</span></div></div>
            <div class="cards-row">${ch.map(t => renderVCard(t)).join("")}</div>
          </div>

          <div class="section">
            <div class="section-header"><div><span class="section-sub">DERETAN LAGU LENGKAP</span><span class="section-title">Rekomendasi Untukmu</span></div></div>
            <div class="v-list">${extra.map((t, idx) => renderNumberedRow(t, idx + 1)).join("")}</div>
          </div>
        `;
      } catch {
        container.innerHTML = '<div class="loader">Gagal memuat katalog. Periksa koneksi internetmu.</div>';
      }
    });

    function renderSongRow(t) {
      const uid = registerTrack(t);
      return `
        <div class="song-row" onclick="selectTrackById('${uid}')">
          <img src="${escHtml(t.cover)}" loading="lazy" />
          <div class="song-meta">
            <div class="song-title">${escHtml(t.title)}</div>
            <div class="song-artist">${escHtml(t.artist)}</div>
          </div>
          <span class="song-dur">${escHtml(t.duration)}</span>
        </div>
      `;
    }

    function renderNumberedRow(t, num) {
      const uid = registerTrack(t);
      return `
        <div class="song-row" onclick="selectTrackById('${uid}')">
          <span class="track-num">${num}</span>
          <img src="${escHtml(t.cover)}" loading="lazy" />
          <div class="song-meta">
            <div class="song-title">${escHtml(t.title)}</div>
            <div class="song-artist">${escHtml(t.artist)}</div>
          </div>
          <span class="song-dur">${escHtml(t.duration)}</span>
        </div>
      `;
    }

    function renderVCard(t) {
      const uid = registerTrack(t);
      return `
        <div class="v-card" onclick="selectTrackById('${uid}')">
          <img src="${escHtml(t.cover)}" loading="lazy" />
          <div class="v-card-title">${escHtml(t.title)}</div>
          <div class="v-card-sub">${escHtml(t.artist)}</div>
        </div>
      `;
    }

    function selectTrackById(uid) {
      const track = trackStore[uid];
      if (!track) return;
      const key = track.videoId || track.trackId || (track.title + track.artist);
      let idx = queue.findIndex(x => (x.videoId || x.trackId || (x.title + x.artist)) === key);
      if (idx === -1) { queue.unshift(track); idx = 0; }
      playAtIndex(idx);
    }

    async function playAtIndex(idx) {
      if (idx < 0 || idx >= queue.length) return;
      currentIndex = idx;
      const track = queue[idx];

      document.getElementById("miniPlayer").style.display = "flex";
      document.getElementById("miniCover").src = track.cover;
      document.getElementById("miniTitle").textContent = track.title;
      document.getElementById("miniArtist").textContent = track.artist;

      document.getElementById("fpArt").src = track.cover;
      document.getElementById("fpTitle").textContent = track.title;
      document.getElementById("fpArtist").textContent = track.artist;
      document.getElementById("streamSourceBadge").textContent = "MENCARI FULL AUDIO...";
      updateLikeIcon();

      let vid = track.videoId && track.videoId.length === 11 ? track.videoId : null;
      if (!vid) {
        vid = await resolveYouTubeVideoId(track.title, track.artist);
        if (vid) track.videoId = vid;
      }

      if (vid && ytReady && ytPlayer && ytPlayer.loadVideoById) {
        activeEngine = "yt";
        audiusAudio.pause();
        document.getElementById("streamSourceBadge").textContent = "FULL SONG • YOUTUBE";
        ytPlayer.loadVideoById(vid);
        ytPlayer.playVideo();
      } else {
        await playViaAudius(track);
      }
    }

    function togglePlay() {
      if (activeEngine === "yt" && ytReady && ytPlayer) isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
      else if (activeEngine === "audius") audiusAudio.paused ? audiusAudio.play() : audiusAudio.pause();
    }
    function playNext() { if (queue.length) playAtIndex((currentIndex + 1) % queue.length); }
    function playPrev() { if (queue.length) playAtIndex((currentIndex - 1 + queue.length) % queue.length); }
    function updatePlayIcons() {
      const icon = isPlaying ? ICON_PAUSE : ICON_PLAY;
      document.getElementById("miniPlayBtn").innerHTML = icon;
      document.getElementById("fpPlayBtn").innerHTML = icon;
    }

    function openSearch() {
      document.getElementById("brandLogo").style.display = "none";
      document.getElementById("topActions").style.display = "none";
      document.getElementById("searchWrap").classList.add("active");
      document.getElementById("searchInput").focus();
      switchTab("search");
    }
    function closeSearch() {
      document.getElementById("brandLogo").style.display = "flex";
      document.getElementById("topActions").style.display = "flex";
      document.getElementById("searchWrap").classList.remove("active");
      switchTab("home");
    }
    async function doSearch(customQuery) {
      const q = customQuery || document.getElementById("searchInput").value.trim();
      if (!q) return;
      switchTab("search");
      document.getElementById("searchHeading").textContent = `Hasil: "${q}"`;
      const box = document.getElementById("searchResults");
      box.innerHTML = '<div class="loader">Mencari lagu full...</div>';
      try {
        const items = await fetchCatalog(q, 25);
        if (!items.length) { box.innerHTML = '<div class="loader">Lagu tidak ditemukan.</div>'; return; }
        box.innerHTML = items.map((t, i) => renderNumberedRow(t, i + 1)).join("");
      } catch {
        box.innerHTML = '<div class="loader">Gagal mencari lagu. Coba lagi.</div>';
      }
    }
    function filterMood(el, query) {
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      if (!query) { closeSearch(); switchTab("home"); } else { doSearch(query); }
    }
    function switchTab(tab) {
      document.getElementById("viewHome").style.display = tab === "home" ? "block" : "none";
      document.getElementById("viewSearch").style.display = tab === "search" ? "block" : "none";
      document.getElementById("viewLibrary").style.display = tab === "library" ? "block" : "none";
      document.getElementById("navHome").classList.toggle("active", tab === "home");
      document.getElementById("navExplore").classList.toggle("active", tab === "search");
      document.getElementById("navLibrary").classList.toggle("active", tab === "library");
      if (tab === "library") renderLibrary();
    }
    function openFullPlayer() { document.getElementById("fullPlayer").style.display = "flex"; }
    function closeFullPlayer() { document.getElementById("fullPlayer").style.display = "none"; closeDrawer(); }
    function toggleLike() {
      if (currentIndex < 0) return;
      const track = queue[currentIndex];
      const key = track.videoId || track.trackId || (track.title + track.artist);
      const idx = likedSongs.findIndex(x => (x.videoId || x.trackId || (x.title + x.artist)) === key);
      idx > -1 ? likedSongs.splice(idx, 1) : likedSongs.unshift(track);
      localStorage.setItem("vibe_liked", JSON.stringify(likedSongs));
      updateLikeIcon();
    }
    function updateLikeIcon() {
      if (currentIndex < 0) return;
      const track = queue[currentIndex];
      const key = track.videoId || track.trackId || (track.title + track.artist);
      const isLiked = likedSongs.some(x => (x.videoId || x.trackId || (x.title + x.artist)) === key);
      document.getElementById("likeBtn").style.color = isLiked ? "#FF0055" : "#ffffff";
    }
    function renderLibrary() {
      const box = document.getElementById("libraryList");
      box.innerHTML = likedSongs.length ? likedSongs.map((t, i) => renderNumberedRow(t, i + 1)).join("") : '<div class="loader">Belum ada lagu yang disukai.</div>';
    }
    async function openDrawer(type) {
      const drawer = document.getElementById("fpDrawer");
      const title = document.getElementById("drawerTitle");
      const body = document.getElementById("drawerBody");
      drawer.style.display = "flex";
      if (type === "queue") {
        title.textContent = "UP NEXT (ANTREAN)";
        body.innerHTML = queue.map((t, i) => `
          <div class="song-row" onclick="playAtIndex(${i}); closeDrawer();" style="margin-bottom:6px;">
            <img src="${escHtml(t.cover)}" />
            <div class="song-meta">
              <div class="song-title ${i === currentIndex ? 'playing-text' : ''}">${escHtml(t.title)}</div>
              <div class="song-artist">${escHtml(t.artist)}</div>
            </div>
          </div>
        `).join("");
      } else {
        title.textContent = "LIRIK LAGU";
        if (currentIndex < 0) return;
        const t = queue[currentIndex];
        body.textContent = "Mencari lirik...";
        try {
          const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(t.artist)}&track_name=${encodeURIComponent(t.title)}`);
          const data = await res.json();
          body.textContent = data.plainLyrics || "Lirik tidak tersedia untuk lagu ini.";
        } catch { body.textContent = "Lirik tidak ditemukan."; }
      }
    }
    function closeDrawer() { document.getElementById("fpDrawer").style.display = "none"; }
  </script>
</body>
</html>
