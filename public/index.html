<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030303" />
  <link rel="manifest" href="/manifest.json" />
  <title>VIBE Music</title>
  <style>
    :root { --bg:#030303; --surface:#121214; --elev:#1c1c21; --chip:rgba(255,255,255,0.08); --text:#fff; --muted:#9e9ea8; --accent:#FF0055; --glow:rgba(255,0,85,0.25); --border:rgba(255,255,255,0.08); }
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
    html, body { min-height:100vh; background-color:var(--bg); background-image:radial-gradient(circle at 50% 0%, #2b0918 0%, #030303 45%); background-repeat:no-repeat; color:var(--text); padding-bottom:135px; overflow-x:hidden; }
    .topbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:rgba(3,3,3,0.9); backdrop-filter:blur(14px); border-bottom:1px solid rgba(255,255,255,0.04); }
    .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:1.25rem; }
    .brand-icon { width:30px; height:30px; border-radius:50%; background:var(--accent); display:grid; place-items:center; box-shadow:0 0 14px var(--glow); }
    .brand-icon svg { width:14px; height:14px; fill:#fff; margin-left:2px; }
    .icon-btn { background:none; border:none; color:#fff; cursor:pointer; display:grid; place-items:center; padding:5px; }
    .search-bar-wrap { display:none; align-items:center; gap:8px; width:100%; }
    .search-bar-wrap.active { display:flex; }
    .search-input { flex:1; background:var(--elev); border:1px solid var(--border); color:#fff; padding:9px 14px; border-radius:99px; font-size:0.92rem; outline:none; }
    .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 16px 14px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { background:var(--chip); border:1px solid var(--border); color:#fff; padding:7px 14px; border-radius:99px; font-size:0.8rem; font-weight:600; white-space:nowrap; cursor:pointer; }
    .chip.active { background:var(--accent); border-color:var(--accent); box-shadow:0 4px 12px var(--glow); }
    .hero-banner { margin:0 16px 20px; padding:16px; border-radius:16px; background:linear-gradient(135deg,#2b0b19 0%,#141419 100%); border:1px solid rgba(255,0,85,0.25); display:flex; align-items:center; gap:14px; cursor:pointer; }
    .hero-banner img { width:76px; height:76px; border-radius:12px; object-fit:cover; flex-shrink:0; }
    .hero-info { flex:1; min-width:0; }
    .hero-tag { font-size:0.68rem; font-weight:800; color:var(--accent); letter-spacing:1px; margin-bottom:4px; }
    .hero-title { font-size:1.05rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hero-sub { font-size:0.8rem; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hero-play { width:42px; height:42px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; flex-shrink:0; }
    .compact-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:0 16px; margin-bottom:24px; }
    .compact-card { background:var(--elev); border-radius:8px; overflow:hidden; display:flex; align-items:center; gap:10px; cursor:pointer; }
    .compact-card img { width:48px; height:48px; object-fit:cover; flex-shrink:0; }
    .compact-title { font-size:0.78rem; font-weight:700; padding-right:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.2; }
    .section { margin-bottom:26px; }
    .section-header { padding:0 16px 12px; }
    .section-sub { font-size:0.68rem; color:var(--accent); font-weight:700; letter-spacing:0.9px; margin-bottom:2px; display:block; }
    .section-title { font-size:1.25rem; font-weight:800; }
    .quick-grid { display:grid; grid-auto-flow:column; grid-template-rows:repeat(4,1fr); grid-auto-columns:82%; gap:10px 14px; overflow-x:auto; padding:0 16px; scroll-snap-type:x mandatory; scrollbar-width:none; }
    .quick-grid::-webkit-scrollbar { display:none; }
    .song-row { display:flex; align-items:center; gap:12px; scroll-snap-align:start; padding:6px 8px; border-radius:10px; cursor:pointer; }
    .song-row:active { background:var(--elev); }
    .track-num { width:22px; text-align:center; font-size:0.8rem; font-weight:700; color:var(--muted); flex-shrink:0; }
    .song-row img { width:52px; height:52px; border-radius:8px; object-fit:cover; background:#1e1e1e; flex-shrink:0; }
    .song-meta { flex:1; min-width:0; }
    .song-title { font-size:0.92rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .song-title.playing-text { color:var(--accent); }
    .song-artist { font-size:0.78rem; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .song-dur { font-size:0.75rem; color:var(--muted); flex-shrink:0; }
    .cards-row { display:flex; gap:14px; overflow-x:auto; padding:0 16px; scrollbar-width:none; }
    .cards-row::-webkit-scrollbar { display:none; }
    .v-card { width:138px; flex-shrink:0; cursor:pointer; }
    .v-card img { width:138px; height:138px; border-radius:10px; object-fit:cover; background:#1e1e1e; margin-bottom:8px; }
    .v-card-title { font-size:0.85rem; font-weight:700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.25; }
    .v-card-sub { font-size:0.75rem; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .v-list { padding:0 12px; display:flex; flex-direction:column; gap:4px; }
    .mini-player { position:fixed; bottom:56px; left:8px; right:8px; height:60px; background:#1c1c22; border:1px solid rgba(255,255,255,0.1); border-radius:12px; display:none; align-items:center; padding:0 12px; gap:12px; z-index:40; overflow:hidden; }
    .mini-progress-bar { position:absolute; bottom:0; left:0; height:3px; background:var(--accent); width:0%; }
    .mini-player img { width:42px; height:42px; border-radius:8px; object-fit:cover; }
    .mini-info { flex:1; min-width:0; cursor:pointer; }
    .mini-title { font-size:0.88rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mini-artist { font-size:0.75rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mini-controls { display:flex; align-items:center; gap:8px; }
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:56px; background:rgba(8,8,10,0.96); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; z-index:45; }
    .nav-item { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:0.68rem; background:none; border:none; cursor:pointer; }
    .nav-item.active { color:var(--accent); font-weight:700; }
    .nav-item svg { width:22px; height:22px; fill:currentColor; }
    .full-player { position:fixed; inset:0; background:linear-gradient(180deg,#2a0a18 0%,#030303 60%); z-index:80; display:none; flex-direction:column; padding:16px 22px 24px; }
    .fp-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .fp-badge { font-size:0.72rem; background:rgba(255,255,255,0.1); padding:4px 12px; border-radius:99px; font-weight:700; }
    .fp-art-wrap { flex:1; display:grid; place-items:center; max-height:290px; margin:4px 0 14px; }
    .fp-art { width:255px; height:255px; border-radius:16px; object-fit:cover; box-shadow:0 20px 50px rgba(0,0,0,0.8); }
    .fp-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; }
    .fp-title { font-size:1.3rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fp-artist { font-size:0.92rem; color:var(--muted); margin-top:4px; }
    .seek-wrap { margin-bottom:10px; }
    .seek-slider { width:100%; accent-color:var(--accent); height:4px; cursor:pointer; }
    .time-row { display:flex; justify-content:space-between; font-size:0.74rem; color:var(--muted); margin-top:4px; }
    .fp-controls { display:flex; align-items:center; justify-content:space-between; margin:8px 0 18px; padding:0 12px; }
    .play-circle { width:64px; height:64px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; border:none; cursor:pointer; }
    .fp-tabs { display:flex; border-top:1px solid var(--border); padding-top:10px; justify-content:space-around; }
    .fp-tab-btn { background:none; border:none; color:var(--muted); font-weight:700; font-size:0.85rem; cursor:pointer; padding:6px 16px; }
    .fp-drawer { display:none; position:fixed; inset:70px 0 0 0; background:#0c0c0e; border-top-left-radius:18px; border-top-right-radius:18px; padding:18px; z-index:90; flex-direction:column; }
    .fp-drawer-body { flex:1; overflow-y:auto; margin-top:12px; white-space:pre-line; line-height:1.75; color:#e5e5ea; font-size:0.95rem; }
    .loader { text-align:center; color:var(--muted); padding:40px 16px; font-size:0.9rem; }
    #ytHiddenWrap { position:fixed; width:1px; height:1px; opacity:0.01; pointer-events:none; bottom:0; left:0; }
  </style>
</head>
<body>
  <div id="ytHiddenWrap"><div id="ytPlayer"></div></div>
  <audio id="bgAudioEngine" preload="auto" playsinline></audio>

  <div class="topbar">
    <div class="brand" id="brandLogo">
      <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <span>VIBE Music</span>
    </div>
    <div class="search-bar-wrap" id="searchWrap">
      <button class="icon-btn" onclick="closeSearch()"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <input type="text" id="searchInput" class="search-input" placeholder="Cari lagu full, artis..." onkeydown="if(event.key==='Enter') doSearch()" />
    </div>
    <div id="topActions">
      <button class="icon-btn" onclick="openSearch()"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
    </div>
  </div>

  <div class="chips" id="moodChips">
    <div class="chip active" onclick="filterMood(this, '')">Untukmu</div>
    <div class="chip" onclick="filterMood(this, 'Tulus Nadin Amizah Hindia')">Indo Indie</div>
    <div class="chip" onclick="filterMood(this, 'Daniel Caesar Frank Ocean Rex Orange County')">Chill R&B</div>
    <div class="chip" onclick="filterMood(this, 'Olivia Rodrigo LANY Justin Bieber')">Global Pop</div>
    <div class="chip" onclick="filterMood(this, 'lagu galau indonesia viral')">Galau Viral</div>
    <div class="chip" onclick="filterMood(this, 'Pamungkas Feby Putri Sal Priadi')">Akustik</div>
  </div>

  <div id="viewHome"><div id="homeContent"><div class="loader">Menyiapkan deretan lagu pilihanmu...</div></div></div>
  <div id="viewSearch" style="display:none;"><div class="section-header"><span class="section-sub">FULL TRACK CATALOG</span><span class="section-title" id="searchHeading">Hasil Pencarian</span></div><div class="v-list" id="searchResults"></div></div>
  <div id="viewLibrary" style="display:none;"><div class="section-header"><span class="section-sub">KOLEKSI TERSIMPAN</span><span class="section-title">Lagu Disukai</span></div><div class="v-list" id="libraryList"></div></div>

  <div class="mini-player" id="miniPlayer">
    <div class="mini-progress-bar" id="miniProgress"></div>
    <img id="miniCover" src="" alt="" onclick="openFullPlayer()" />
    <div class="mini-info" onclick="openFullPlayer()"><div class="mini-title" id="miniTitle">Judul Lagu</div><div class="mini-artist" id="miniArtist">Artis</div></div>
    <div class="mini-controls">
      <button class="icon-btn" onclick="togglePlay()" id="miniPlayBtn"></button>
      <button class="icon-btn" onclick="playNext()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="navHome" onclick="switchTab('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></button>
    <button class="nav-item" id="navExplore" onclick="openSearch()"><svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg><span>Explore</span></button>
    <button class="nav-item" id="navLibrary" onclick="switchTab('library')"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg><span>Library</span></button>
  </nav>

  <div class="full-player" id="fullPlayer">
    <div class="fp-top">
      <button class="icon-btn" onclick="closeFullPlayer()"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></button>
      <span class="fp-badge" id="streamSourceBadge">BACKGROUND • FULL AUDIO</span>
      <button class="icon-btn" onclick="openDrawer('lyrics')"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/></svg></button>
    </div>
    <div class="fp-art-wrap"><img id="fpArt" class="fp-art" src="" alt="Cover" /></div>
    <div class="fp-meta">
      <div style="min-width:0;flex:1;"><div class="fp-title" id="fpTitle">Judul Lagu</div><div class="fp-artist" id="fpArtist">Artis</div></div>
      <button class="icon-btn" id="likeBtn" onclick="toggleLike()"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg></button>
    </div>
    <div class="seek-wrap"><input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" oninput="seekTo(this.value)" /><div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div></div>
    <div class="fp-controls">
      <button class="icon-btn" onclick="playPrev()"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="play-circle" onclick="togglePlay()" id="fpPlayBtn"></button>
      <button class="icon-btn" onclick="playNext()"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="fp-tabs"><button class="fp-tab-btn" onclick="openDrawer('queue')">UP NEXT</button><button class="fp-tab-btn" onclick="openDrawer('lyrics')">LYRICS</button></div>
  </div>

  <div class="fp-drawer" id="fpDrawer">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;"><strong id="drawerTitle">LYRICS</strong><button class="icon-btn" onclick="closeDrawer()" style="font-size:0.85rem;font-weight:700;">TUTUP</button></div>
    <div class="fp-drawer-body" id="drawerBody"></div>
  </div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer = null, ytReady = false, activeEngine = "native";
    const bgAudio = document.getElementById("bgAudioEngine");
    let trackStore = {}, queue = [], currentIndex = -1, isPlaying = false;
    let likedSongs = JSON.parse(localStorage.getItem("vibe_liked") || "[]");
    const ICON_PLAY = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    function syncMediaSession(t) {
      if (!("mediaSession" in navigator) || !t) return;
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: "VIBE Music", artwork: [{ src: t.cover, sizes: "512x512", type: "image/jpeg" }] });
      navigator.mediaSession.setActionHandler("play", () => { if (!isPlaying) togglePlay(); });
      navigator.mediaSession.setActionHandler("pause", () => { if (isPlaying) togglePlay(); });
      navigator.mediaSession.setActionHandler("previoustrack", playPrev);
      navigator.mediaSession.setActionHandler("nexttrack", playNext);
    }
    function registerTrack(t) { const uid = "trk_" + Math.random().toString(36).slice(2, 10); trackStore[uid] = t; return uid; }
    function escHtml(s) { return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("ytPlayer", {
        height: "1", width: "1", playerVars: { autoplay: 1, controls: 0, playsinline: 1, rel: 0 },
        events: {
          onReady: () => { ytReady = true; },
          onStateChange: (e) => {
            if (activeEngine !== "yt") return;
            if (e.data === YT.PlayerState.PLAYING) { isPlaying = true; updatePlayIcons(); }
            if (e.data === YT.PlayerState.PAUSED) { isPlaying = false; updatePlayIcons(); }
            if (e.data === YT.PlayerState.ENDED) playNext();
          },
          onError: () => { if (currentIndex >= 0) playNext(); }
        }
      });
    }
    bgAudio.addEventListener("play", () => { if (activeEngine === "native") { isPlaying = true; updatePlayIcons(); if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing"; } });
    bgAudio.addEventListener("pause", () => { if (activeEngine === "native") { isPlaying = false; updatePlayIcons(); if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; } });
    bgAudio.addEventListener("ended", () => { if (activeEngine === "native") playNext(); });

    setInterval(() => {
      let cur = 0, dur = 0;
      if (activeEngine === "native") { cur = bgAudio.currentTime || 0; dur = bgAudio.duration || 0; }
      else if (activeEngine === "yt" && ytReady && ytPlayer?.getCurrentTime) { cur = ytPlayer.getCurrentTime() || 0; dur = ytPlayer.getDuration() || 0; }
      if (dur > 0) {
        const pct = (cur / dur) * 100;
        document.getElementById("seekSlider").value = pct;
        document.getElementById("miniProgress").style.width = pct + "%";
        document.getElementById("curTime").textContent = fmtSec(cur);
        document.getElementById("durTime").textContent = fmtSec(dur);
      }
    }, 500);

    function fmtSec(s) { const m = Math.floor(s / 60), sec = Math.floor(s % 60); return `${m}:${String(sec).padStart(2, "0")}`; }
    function seekTo(pct) {
      if (activeEngine === "native" && bgAudio.duration) bgAudio.currentTime = (pct / 100) * bgAudio.duration;
      else if (activeEngine === "yt" && ytReady && ytPlayer?.getDuration) ytPlayer.seekTo((pct / 100) * ytPlayer.getDuration(), true);
    }

    async function fetchCatalog(query, limit = 15) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        if (res.ok) { const d = await res.json(); if (d.results?.length && !d.results[0].audioUrl) return d.results; }
      } catch {}
      const itunes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=${limit}&country=ID`);
      const json = await itunes.json();
      return (json.results || []).map(i => ({ videoId: "", trackId: String(i.trackId), title: i.trackName, artist: i.artistName, duration: fmtSec((i.trackTimeMillis || 0) / 1000), cover: (i.artworkUrl100 || "").replace("100x100bb", "500x500bb"), previewUrl: i.previewUrl || "" }));
    }

    async function resolveFullVideoId(track) {
      if (track.videoId && track.videoId.length === 11) return track.videoId;
      const q = `${track.title} ${track.artist} official audio`;
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        if (res.ok) {
          const data = await res.json();
          const hit = (data.results || []).find(x => x.videoId && x.videoId.length === 11);
          if (hit) return hit.videoId;
        }
      } catch {}
      return null;
    }

    async function resolveNativeAudio(track, vid) {
      const q = `${track.title} ${track.artist}`;
      try {
        const res = await fetch(`https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(q)}&limit=3`);
        const json = await res.json();
        const hit = (json.data || []).find(t => t.id && t.title.toLowerCase().includes(track.title.toLowerCase().slice(0, 6)));
        if (hit?.id) return { url: `https://discoveryprovider.audius.co/v1/tracks/${hit.id}/stream`, label: "BACKGROUND FULL • AUDIUS" };
      } catch {}

      if (vid) {
        const invHosts = ["https://inv.nadeko.net", "https://invidious.nerdvpn.de", "https://yt.artemislena.eu"];
        for (const host of invHosts) {
          try {
            const ctrl = new AbortController();
            const tmr = setTimeout(() => ctrl.abort(), 3500);
            const r = await fetch(`${host}/api/v1/videos/${vid}`, { signal: ctrl.signal });
            clearTimeout(tmr);
            if (r.ok) {
              const d = await r.json();
              const aud = (d.adaptiveFormats || []).find(f => f.type?.startsWith("audio/mp4") || f.type?.startsWith("audio/webm"));
              if (aud?.url) return { url: aud.url, label: "BACKGROUND FULL • STREAM" };
            }
          } catch {}
        }
      }
      return null;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && activeEngine === "yt" && isPlaying && ytPlayer?.playVideo) {
        setTimeout(() => ytPlayer.playVideo(), 250);
        setTimeout(() => ytPlayer.playVideo(), 800);
      }
    });

    window.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("homeContent");
      try {
        const [qp, tr, ch, extra] = await Promise.all([
          fetchCatalog("Tulus Nadin Amizah Hindia", 12),
          fetchCatalog("Top Hits Indonesia 2026", 12),
          fetchCatalog("Daniel Caesar Frank Ocean LANY", 12),
          fetchCatalog("Pamungkas Sal Priadi Olivia Rodrigo", 25)
        ]);
        queue = [...qp, ...tr, ...ch, ...extra];
        const hero = qp[0] || tr[0], heroUid = registerTrack(hero);
        const topSix = [...tr.slice(0, 3), ...ch.slice(0, 3)];
        container.innerHTML = `
          ${hero ? `<div class="hero-banner" onclick="selectTrackById('${heroUid}')"><img src="${escHtml(hero.cover)}" /><div class="hero-info"><div class="hero-tag">PILIHAN UTAMA HARI INI</div><div class="hero-title">${escHtml(hero.title)}</div><div class="hero-sub">${escHtml(hero.artist)} • Full Song</div></div><div class="hero-play"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>` : ""}
          <div class="compact-grid">${topSix.map(t => { const u = registerTrack(t); return `<div class="compact-card" onclick="selectTrackById('${u}')"><img src="${escHtml(t.cover)}" /><div class="compact-title">${escHtml(t.title)}</div></div>`; }).join("")}</div>
          <div class="section"><div class="section-header"><span class="section-sub">PILIHAN CEPAT</span><span class="section-title">Quick picks</span></div><div class="quick-grid">${qp.map(t => renderSongRow(t)).join("")}</div></div>
          <div class="section"><div class="section-header"><span class="section-sub">LAGI POPULER</span><span class="section-title">Trending Indonesia</span></div><div class="cards-row">${tr.map(t => renderVCard(t)).join("")}</div></div>
          <div class="section"><div class="section-header"><span class="section-sub">SANTAI & VIBE</span><span class="section-title">Chill & R&B Mix</span></div><div class="cards-row">${ch.map(t => renderVCard(t)).join("")}</div></div>
          <div class="section"><div class="section-header"><span class="section-sub">DERETAN LAGU LENGKAP</span><span class="section-title">Rekomendasi Untukmu</span></div><div class="v-list">${extra.map((t, i) => renderNumberedRow(t, i + 1)).join("")}</div></div>
        `;
      } catch { container.innerHTML = '<div class="loader">Gagal memuat katalog. Periksa koneksi internetmu.</div>'; }
    });

    function renderSongRow(t) { const u = registerTrack(t); return `<div class="song-row" onclick="selectTrackById('${u}')"><img src="${escHtml(t.cover)}" loading="lazy" /><div class="song-meta"><div class="song-title">${escHtml(t.title)}</div><div class="song-artist">${escHtml(t.artist)}</div></div><span class="song-dur">${escHtml(t.duration)}</span></div>`; }
    function renderNumberedRow(t, n) { const u = registerTrack(t); return `<div class="song-row" onclick="selectTrackById('${u}')"><span class="track-num">${n}</span><img src="${escHtml(t.cover)}" loading="lazy" /><div class="song-meta"><div class="song-title">${escHtml(t.title)}</div><div class="song-artist">${escHtml(t.artist)}</div></div><span class="song-dur">${escHtml(t.duration)}</span></div>`; }
    function renderVCard(t) { const u = registerTrack(t); return `<div class="v-card" onclick="selectTrackById('${u}')"><img src="${escHtml(t.cover)}" loading="lazy" /><div class="v-card-title">${escHtml(t.title)}</div><div class="v-card-sub">${escHtml(t.artist)}</div></div>`; }

    function selectTrackById(u) {
      const t = trackStore[u]; if (!t) return;
      const k = t.videoId || t.trackId || (t.title + t.artist);
      let idx = queue.findIndex(x => (x.videoId || x.trackId || (x.title + x.artist)) === k);
      if (idx === -1) { queue.unshift(t); idx = 0; }
      playAtIndex(idx);
    }

    async function playAtIndex(idx) {
      if (idx < 0 || idx >= queue.length) return;
      currentIndex = idx; const track = queue[idx];
      document.getElementById("miniPlayer").style.display = "flex";
      document.getElementById("miniCover").src = track.cover;
      document.getElementById("miniTitle").textContent = track.title;
      document.getElementById("miniArtist").textContent = track.artist;
      document.getElementById("fpArt").src = track.cover;
      document.getElementById("fpTitle").textContent = track.title;
      document.getElementById("fpArtist").textContent = track.artist;
      document.getElementById("streamSourceBadge").textContent = "MENCARI FULL SONG...";
      updateLikeIcon(); syncMediaSession(track);

      const vid = await resolveFullVideoId(track);
      if (vid) track.videoId = vid;

      const nativeStream = await resolveNativeAudio(track, vid);
      if (nativeStream?.url) {
        activeEngine = "native";
        if (ytReady && ytPlayer?.stopVideo) ytPlayer.stopVideo();
        document.getElementById("streamSourceBadge").textContent = nativeStream.label;
        bgAudio.src = nativeStream.url;
        try { await bgAudio.play(); return; } catch {}
      }

      if (vid && ytReady && ytPlayer?.loadVideoById) {
        activeEngine = "yt";
        bgAudio.pause();
        document.getElementById("streamSourceBadge").textContent = "FULL SONG • STREAM";
        ytPlayer.loadVideoById(vid);
        ytPlayer.playVideo();
        return;
      }

      if (track.previewUrl) {
        activeEngine = "native";
        document.getElementById("streamSourceBadge").textContent = "PREVIEW 30s";
        bgAudio.src = track.previewUrl;
        bgAudio.play();
      }
    }

    function togglePlay() { if (activeEngine === "native") bgAudio.paused ? bgAudio.play() : bgAudio.pause(); else if (activeEngine === "yt" && ytReady && ytPlayer) isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); }
    function playNext() { if (queue.length) playAtIndex((currentIndex + 1) % queue.length); }
    function playPrev() { if (queue.length) playAtIndex((currentIndex - 1 + queue.length) % queue.length); }
    function updatePlayIcons() { const ic = isPlaying ? ICON_PAUSE : ICON_PLAY; document.getElementById("miniPlayBtn").innerHTML = ic; document.getElementById("fpPlayBtn").innerHTML = ic; }
    function openSearch() { document.getElementById("brandLogo").style.display = "none"; document.getElementById("topActions").style.display = "none"; document.getElementById("searchWrap").classList.add("active"); document.getElementById("searchInput").focus(); switchTab("search"); }
    function closeSearch() { document.getElementById("brandLogo").style.display = "flex"; document.getElementById("topActions").style.display = "flex"; document.getElementById("searchWrap").classList.remove("active"); switchTab("home"); }
    async function doSearch(cq) {
      const q = cq || document.getElementById("searchInput").value.trim(); if (!q) return;
      switchTab("search"); document.getElementById("searchHeading").textContent = `Hasil: "${q}"`;
      const box = document.getElementById("searchResults"); box.innerHTML = '<div class="loader">Mencari lagu full...</div>';
      try {
        const items = await fetchCatalog(q, 25);
        box.innerHTML = items.length ? items.map((t, i) => renderNumberedRow(t, i + 1)).join("") : '<div class="loader">Lagu tidak ditemukan.</div>';
      } catch { box.innerHTML = '<div class="loader">Gagal mencari lagu.</div>'; }
    }
    function filterMood(el, q) { document.querySelectorAll(".chip").forEach(c => c.classList.remove("active")); el.classList.add("active"); if (!q) { closeSearch(); switchTab("home"); } else doSearch(q); }
    function switchTab(tab) {
      document.getElementById("viewHome").style.display = tab === "home" ? "block" : "none";
      document.getElementById("viewSearch").style.display = tab === "search" ? "block" : "none";
      document.getElementById("viewLibrary").style.display = tab === "library" ? "block" : "none";
      document.getElementById("navHome").classList.toggle("active", tab === "home");
      document.getElementById("navExplore").classList.toggle("active", tab === "search");
      document.getElementById("navLibrary").classList.toggle("active", tab === "library");
      if (tab === "library") renderLibrary();
    }
    function openFullPlayer() { document.getElementById("fullPlayer").style.display = "flex"; }
    function closeFullPlayer() { document.getElementById("fullPlayer").style.display = "none"; closeDrawer(); }
    function toggleLike() {
      if (currentIndex < 0) return; const t = queue[currentIndex], k = t.videoId || t.trackId || (t.title + t.artist);
      const idx = likedSongs.findIndex(x => (x.videoId || x.trackId || (x.title + x.artist)) === k);
      idx > -1 ? likedSongs.splice(idx, 1) : likedSongs.unshift(t);
      localStorage.setItem("vibe_liked", JSON.stringify(likedSongs)); updateLikeIcon();
    }
    function updateLikeIcon() {
      if (currentIndex < 0) return; const t = queue[currentIndex], k = t.videoId || t.trackId || (t.title + t.artist);
      document.getElementById("likeBtn").style.color = likedSongs.some(x => (x.videoId || x.trackId || (x.title + x.artist)) === k) ? "#FF0055" : "#ffffff";
    }
    function renderLibrary() { const box = document.getElementById("libraryList"); box.innerHTML = likedSongs.length ? likedSongs.map((t, i) => renderNumberedRow(t, i + 1)).join("") : '<div class="loader">Belum ada lagu yang disukai.</div>'; }
    async function openDrawer(type) {
      const d = document.getElementById("fpDrawer"), title = document.getElementById("drawerTitle"), body = document.getElementById("drawerBody");
      d.style.display = "flex";
      if (type === "queue") {
        title.textContent = "UP NEXT (ANTREAN)";
        body.innerHTML = queue.map((t, i) => `<div class="song-row" onclick="playAtIndex(${i});closeDrawer();" style="margin-bottom:6px;"><img src="${escHtml(t.cover)}" /><div class="song-meta"><div class="song-title ${i===currentIndex?'playing-text':''}">${escHtml(t.title)}</div><div class="song-artist">${escHtml(t.artist)}</div></div></div>`).join("");
      } else {
        title.textContent = "LIRIK LAGU"; if (currentIndex < 0) return; const t = queue[currentIndex]; body.textContent = "Mencari lirik...";
        try { const data = await (await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(t.artist)}&track_name=${encodeURIComponent(t.title)}`)).json(); body.textContent = data.plainLyrics || "Lirik tidak tersedia."; } catch { body.textContent = "Lirik tidak ditemukan."; }
      }
    }
    function closeDrawer() { document.getElementById("fpDrawer").style.display = "none"; }
  </script>
</body>
</html>
